<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f08aae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MOMENTOO EVENTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7fa;color:#30242c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #f0dce5;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(80,30,55,.06)}
h1{margin:0;font-size:25px}
h2{margin:0 0 12px;font-size:20px}
h3{margin:0 0 8px}
.muted,.small{color:#8b7882;font-size:13px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;font-size:14px}
.primary{background:#ed82a8;color:white}
.secondary{background:#f7e8ee;color:#673b4e}
.red{background:#ffe4e8;color:#b4233e}
.green{background:#e4f7ec;color:#28734b}
.gray{background:#eee9ec;color:#51474d}
input,select{width:100%;padding:11px 12px;border:1px solid #e4d6dd;border-radius:11px;background:white;font-size:15px;outline:none}
input:focus,select:focus{border-color:#ed82a8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.pro,.package,.cat{border:1px solid #ecdde4;border-radius:15px;padding:12px;margin-top:9px;background:#fff}
.package-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{background:#f8e7ee;padding:5px 9px;border-radius:20px;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sum{padding:12px;border-radius:12px;background:#faf7f9}
.sum.profit{background:#edf9f2}
.sum.total{background:#fff7dc}
.sum small{display:block;color:#807482}
.sum strong{font-size:18px}
.topbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.topbar button{flex:1}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(35,20,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modalbox{background:white;width:min(700px,100%);max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.list{max-height:55vh;overflow:auto}
.staff{border:1px solid #eadde3;border-radius:12px;padding:10px;margin-top:8px}
.staffgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:7px;align-items:center}
.totalline{display:flex;justify-content:space-between;padding:9px 0;border-top:1px dashed #ddd}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.notice{padding:10px;border-radius:12px;background:#fff1f5;margin-top:8px;font-size:13px}
.catbtn{width:100%;text-align:left;background:#fff7fa;border:1px solid #efdce5;color:#4d3340}
@media(max-width:700px){
 .grid,.grid2,.summary{grid-template-columns:1fr}
 .staffgrid{grid-template-columns:1fr 1fr}
 .staffgrid .full{grid-column:1/-1}
 .package-head{align-items:flex-start;flex-direction:column}
 .topbar button{flex:auto}
}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
  <h1>MOMENTOO EVENTS ✨</h1>
  <div class="muted">Միջոցառումների մասնագետների, փաթեթների և բյուջեի կառավարում</div>
  <div class="topbar">
    <button class="primary" onclick="showPanel('home')">Գլխավոր</button>
    <button class="secondary" onclick="showPanel('pros')">Մասնագետներ</button>
    <button class="secondary" onclick="showPanel('cats')">Բաժիններ</button>
    <button class="secondary" onclick="showPanel('packs')">Փաթեթներ</button>
    <button class="secondary" onclick="showPanel('budget')">Բյուջետային</button>
    <button class="secondary" onclick="showPanel('payments')">Վճարումներ</button>
    <button class="secondary" onclick="showPanel('backup')">Backup</button>
  </div>
</div>

<div id="app"></div>

</div>

<div id="modal" class="modal hidden">
 <div class="modalbox">
  <div class="section-title">
   <h2 id="modalTitle">Մասնագետներ</h2>
   <button class="gray" onclick="closeModal()">✕</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

<script>
'use strict';

const PRO_KEY='momentoo_pros_v3';
const PACK_KEY='momentoo_packs_v6';
const CAT_KEY='momentoo_categories_v2';
const BUDGET_KEY='momentoo_budget_packs_v1';
const WORK_KEY='momentoo_work_state_v1';
const BACKUP_KEY='momentoo_full_backup_v2';

const DEFAULT_CATS=[
 'DJ-ներ','Ջութակահարներ','Ռիլմեյքերներ','Լուսանկարիչներ',
 'Դրոն նկարահանում','Ֆոտոզոնա / Դեկոր','Պարային շոուներ',
 'Արջուկներ / կերպարներ','Երաժիշտներ','Ծաղիկներ','Այլ'
];

const SEED_PACKS=[
 'Երեխայի ծնունդ',
 'Նորածնի դուրսգրում',
 'Կնունքի փաթեթ',
 'Ատամհատիկ',
 'Մայրիկի համար',
 'Ամուսնության առաջարկ Ասա այո'
];

let pros=[];
let packs=[];
let cats=[];
let budgetPacks=[];
let current={name:'',staff:[]};
let budgetDraft={name:'',budget:0,staff:[]};
let editingProId=null;
let pickerMode='normal';
let pickerCat='';
let editingBudgetId=null;
let editingPackId=null;

let cloudReady=false;
let cloudApplying=false;
let cloudTimer=null;

const firebaseConfig={
 apiKey:'AIzaSyBka_OD8XoM5X6K-zw2SjejfMXTeHzwC0',
 authDomain:'momentoo-events.firebaseapp.com',
 projectId:'momentoo-events',
 storageBucket:'momentoo-events.firebasestorage.app',
 messagingSenderId:'111582575594',
 appId:'1:111582575594:web:682c651a0cb1e5cc3d9093',
 measurementId:'G-CV4DGR3T46'
};

function uid(){
 return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);
}

function num(v){
 return Number(String(v??'').replace(/[^\d.-]/g,''))||0;
}

function money(v){
 return num(v).toLocaleString('hy-AM')+' ֏';
}

function clone(x){
 return JSON.parse(JSON.stringify(x));
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
 }[m]));
}

function normalizePro(p){
 return {
  id:p.id||uid(),
  name:String(p.name||'').trim(),
  category:p.category||'Այլ',
  maxPrice:num(p.maxPrice??p.market??p.marketPrice),
  minPrice:num(p.minPrice??p.minimum??p.min),
  companyAmount:num(p.companyAmount??p.baseProfit??0),
  baseProfit:num(p.baseProfit??p.companyAmount??0),
  otherAmount:num(p.otherAmount??0)
 };
}

function normalizeStaff(s){
 return {
  id:s.id||uid(),
  proId:s.proId||s.idPro||'',
  name:s.name||'',
  category:s.category||'Այլ',
  market:num(s.market??s.maxPrice),
  amount:num(s.amount??s.companyAmount??s.minPrice),
  profit:num(s.profit??0)
 };
}

function normalizePack(p){
 return {
  id:p.id||uid(),
  name:p.name||'Անանուն փաթեթ',
  staff:Array.isArray(p.staff)?p.staff.map(normalizeStaff):[]
 };
}

function normalizeBudget(p){
 return {
  id:p.id||uid(),
  name:p.name||'Բյուջետային փաթեթ',
  budget:num(p.budget),
  staff:Array.isArray(p.staff)?p.staff.map(normalizeStaff):[]
 };
}

function load(){
 try{pros=JSON.parse(localStorage.getItem(PRO_KEY)||'[]')}catch(e){pros=[]}
 try{packs=JSON.parse(localStorage.getItem(PACK_KEY)||'[]')}catch(e){packs=[]}
 try{cats=JSON.parse(localStorage.getItem(CAT_KEY)||'[]')}catch(e){cats=[]}
 try{budgetPacks=JSON.parse(localStorage.getItem(BUDGET_KEY)||'[]')}catch(e){budgetPacks=[]}

 pros=Array.isArray(pros)?pros.map(normalizePro):[];
 packs=Array.isArray(packs)?packs.map(normalizePack):[];
 budgetPacks=Array.isArray(budgetPacks)?budgetPacks.map(normalizeBudget):[];

 if(!cats.length)cats=clone(DEFAULT_CATS);

 try{
  const w=JSON.parse(localStorage.getItem(WORK_KEY)||'null');
  if(w){
   if(w.current)current=w.current;
   if(w.budgetDraft)budgetDraft=w.budgetDraft;
  }
 }catch(e){}

 localStorage.setItem(PRO_KEY,JSON.stringify(pros));
 localStorage.setItem(PACK_KEY,JSON.stringify(packs));
 localStorage.setItem(CAT_KEY,JSON.stringify(cats));
 localStorage.setItem(BUDGET_KEY,JSON.stringify(budgetPacks));

 renderHome();
}

function savePros(){
 localStorage.setItem(PRO_KEY,JSON.stringify(pros));
 scheduleCloudSave();
}

function savePacks(){
 localStorage.setItem(PACK_KEY,JSON.stringify(packs));
 scheduleCloudSave();
}

function saveCats(){
 localStorage.setItem(CAT_KEY,JSON.stringify(cats));
 scheduleCloudSave();
}

function saveBudgetPacks(){
 localStorage.setItem(BUDGET_KEY,JSON.stringify(budgetPacks));
 scheduleCloudSave();
}

function saveWorkState(){
 localStorage.setItem(WORK_KEY,JSON.stringify({current,budgetDraft}));
 if(!cloudApplying)scheduleCloudSave();
}

function saveFullBackup(){
 const data={
  version:2,
  createdAt:new Date().toISOString(),
  pros:clone(pros),
  packs:clone(packs),
  cats:clone(cats),
  budgetPacks:clone(budgetPacks),
  current:clone(current),
  budgetDraft:clone(budgetDraft)
 };
 localStorage.setItem(BACKUP_KEY,JSON.stringify(data));
 return data;
}

function renderHome(){
 document.getElementById('app').innerHTML=`
 <div class="card">
  <h2>MOMENTOO EVENTS</h2>
  <div class="muted">Քո բոլոր տվյալները պահվում են և՛ սարքում, և՛ Firebase-ում։</div>
  <div class="topbar">
   <button class="primary" onclick="newNormalPackage()">+ Ավելացնել փաթեթ</button>
   <button class="primary" onclick="newBudgetPackage()">+ Ավելացնել բյուջետային փաթեթ</button>
  </div>
 </div>

 <div class="card">
  <div class="summary">
   <div class="sum"><small>Մասնագետներ</small><strong>${pros.length}</strong></div>
   <div class="sum profit"><small>Բաժիններ</small><strong>${cats.length}</strong></div>
   <div class="sum total"><small>Փաթեթներ</small><strong>${packs.length+budgetPacks.length}</strong></div>
  </div>
 </div>

 <div class="card">
  <h3>Պահված փաթեթներ</h3>
  ${packs.length?packs.slice(0,8).map(p=>`
   <div class="pro row" style="justify-content:space-between">
    <div><b>${esc(p.name)}</b><div class="small">${p.staff.length} մասնագետ</div></div>
    <button class="secondary" onclick="openPack(${JSON.stringify(p.id)})">Բացել</button>
   </div>`).join(''):'<div class="muted">Դեռ փաթեթ չկա։</div>'}
 </div>
 `;
}

function showPanel(panel){
 if(panel==='home')return renderHome();
 if(panel==='pros')return renderPros();
 if(panel==='cats')return renderCats();
 if(panel==='packs')return renderPacks();
 if(panel==='budget')return renderBudgetPacks();
 if(panel==='payments')return renderPayments();
 if(panel==='backup')return renderBackup();
}

function renderPros(){
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="section-title">
   <h2>${editingProId?'✏️ Խմբագրել մասնագետին':'➕ Ավելացնել մասնագետ'}</h2>
   <button class="gray" onclick="showPanel('home')">← Հետ</button>
  </div>
  <div class="grid2">
   <input id="proName" placeholder="Մասնագետի անունը">
   <select id="proCat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
   <input id="pMax" type="number" placeholder="Շուկայական գին" oninput="updateDerived()">
   <input id="pMin" type="number" placeholder="Մինիմալ գին" oninput="updateDerived()">
  </div>
  <div id="proDerived" class="notice">Իմ գումարը՝ 0 ֏</div>
  <div class="topbar">
   <button class="primary" onclick="savePro()">${editingProId?'Պահպանել փոփոխությունը':'Ավելացնել մասնագետ'}</button>
   ${editingProId?'<button class="gray" onclick="cancelProEdit()">Չեղարկել</button>':''}
  </div>
 </div>

 <div class="card">
  <h2>Մասնագետներ (${pros.length})</h2>
  ${pros.length?pros.map(p=>`
   <div class="pro">
    <div class="row" style="justify-content:space-between">
     <div><b>${esc(p.name)}</b><div class="small">${esc(p.category)}</div></div>
     <span class="badge">Շուկա ${money(p.maxPrice)}</span>
    </div>
    <div class="grid">
     <div><div class="small">Շուկայական</div><b>${money(p.maxPrice)}</b></div>
     <div><div class="small">Մինիմալ</div><b>${money(p.minPrice)}</b></div>
     <div><div class="small">Իմ գումարը</div><b>${money(Math.max(0,p.maxPrice-p.minPrice))}</b></div>
    </div>
    <div class="topbar">
     <button class="secondary" onclick="editPro(${JSON.stringify(p.id)})">✏️ Փոխել</button>
     <button class="red" onclick="deletePro(${JSON.stringify(p.id)})">🗑 Ջնջել</button>
    </div>
   </div>`).join(''):'<div class="muted">Մասնագետներ չկան։</div>'}
 </div>`;
}

function updateDerived(){
 const market=num(document.getElementById('pMax')?.value);
 const min=num(document.getElementById('pMin')?.value);
 const d=document.getElementById('proDerived');
 if(d)d.textContent='Իմ գումարը՝ '+money(Math.max(0,market-min));
}

function savePro(){
 const name=document.getElementById('proName').value.trim();
 const category=document.getElementById('proCat').value;
 const market=num(document.getElementById('pMax').value);
 const minimum=num(document.getElementById('pMin').value);

 if(!name)return alert('Գրիր մասնագետի անունը');
 if(market<=0)return alert('Գրիր շուկայական գինը');
 if(minimum>market)return alert('Մինիմալ գինը չի կարող մեծ լինել շուկայականից');

 if(editingProId){
  const p=pros.find(x=>x.id===editingProId);
  if(p){
   p.name=name;
   p.category=category;
   p.maxPrice=market;
   p.minPrice=minimum;
   p.companyAmount=market-minimum;
   p.baseProfit=market-minimum;
  }
 }else{
  pros.push({
   id:uid(),
   name,
   category,
   maxPrice:market,
   minPrice:minimum,
   companyAmount:market-minimum,
   baseProfit:market-minimum,
   otherAmount:0
  });
 }

 editingProId=null;
 savePros();
 renderPros();
}

function editPro(id){
 const p=pros.find(x=>x.id===id);
 if(!p)return;
 editingProId=id;
 renderPros();
 setTimeout(()=>{
  document.getElementById('proName').value=p.name;
  document.getElementById('proCat').value=p.category;
  document.getElementById('pMax').value=p.maxPrice;
  document.getElementById('pMin').value=p.minPrice;
  updateDerived();
  window.scrollTo({top:0,behavior:'smooth'});
 },0);
}

function cancelProEdit(){
 editingProId=null;
 renderPros();
}

function deletePro(id){
 const p=pros.find(x=>x.id===id);
 if(!p)return;
 if(!confirm(`Ջնջե՞լ ${p.name}-ին`))return;
 pros=pros.filter(x=>x.id!==id);
 savePros();
 renderPros();
}

function renderCats(){
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="section-title">
   <h2>Բաժիններ</h2>
   <button class="gray" onclick="showPanel('home')">← Հետ</button>
  </div>
  <div class="grid2">
   <input id="newCat" placeholder="Նոր բաժնի անունը">
   <button class="primary" onclick="addCategory()">+ Ավելացնել բաժին</button>
  </div>
 </div>

 <div class="card">
  ${cats.map(c=>{
   const count=pros.filter(p=>p.category===c).length;
   return `<div class="cat row" style="justify-content:space-between">
    <button class="catbtn" style="flex:1" onclick="openCategory(${JSON.stringify(c)})">
     <b>${esc(c)}</b><span class="small"> · ${count} մասնագետ</span>
    </button>
    <button class="secondary" onclick="renameCategory(${JSON.stringify(c)})">✏️</button>
    <button class="red" onclick="deleteCategory(${JSON.stringify(c)})">🗑</button>
   </div>`;
  }).join('')}
 </div>`;
}

function addCategory(){
 const input=document.getElementById('newCat');
 const name=input.value.trim();
 if(!name)return;
 if(cats.includes(name))return alert('Այս բաժինը արդեն կա');
 cats.push(name);
 saveCats();
 renderCats();
}

function renameCategory(oldName){
 const n=prompt('Նոր անունը',oldName);
 if(n===null)return;
 const name=n.trim();
 if(!name||name===oldName)return;
 if(cats.includes(name))return alert('Այս անունով բաժին արդեն կա');

 cats=cats.map(c=>c===oldName?name:c);
 pros.forEach(p=>{if(p.category===oldName)p.category=name});
 saveCats();
 savePros();
 renderCats();
}

function deleteCategory(name){
 const count=pros.filter(p=>p.category===name).length;
 if(count>0)return alert('Այս բաժինը չի կարելի ջնջել, քանի դեռ մասնագետներ կան դրա մեջ։');
 if(!confirm(`Ջնջե՞լ «${name}» բաժինը`))return;
 cats=cats.filter(c=>c!==name);
 saveCats();
 renderCats();
}

function openCategory(category){
 const arr=pros.filter(p=>p.category===category);
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="section-title">
   <div><h2>${esc(category)}</h2><div class="muted">${arr.length} մասնագետ</div></div>
   <button class="gray" onclick="showPanel('cats')">← Բաժիններ</button>
  </div>
 </div>
 <div class="card">
  ${arr.length?arr.map(p=>`
   <div class="pro">
    <b>${esc(p.name)}</b>
    <div class="grid">
     <div><div class="small">Շուկա</div><b>${money(p.maxPrice)}</b></div>
     <div><div class="small">Մինիմալ</div><b>${money(p.minPrice)}</b></div>
     <div><div class="small">Իմ գումարը</div><b>${money(p.maxPrice-p.minPrice)}</b></div>
    </div>
   </div>`).join(''):'<div class="muted">Այս բաժնում մասնագետ չկա։</div>'}
 </div>`;
}

function newNormalPackage(){
 current={name:'',staff:[]};
 editingPackId=null;
 renderPackageEditor();
}

function renderPacks(){
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="section-title">
   <h2>Փաթեթներ</h2>
   <button class="gray" onclick="showPanel('home')">← Հետ</button>
  </div>
  <div class="grid2">
   <button class="primary" onclick="newNormalPackage()">+ Ավելացնել փաթեթ</button>
   <button class="secondary" onclick="newBudgetPackage()">+ Բյուջետային փաթեթ</button>
  </div>

function downloadBackup(){

function importBackup(e){
 const file=e.target.files?.[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!Array.isArray(data.pros)||!Array.isArray(data.packs)||!Array.isArray(data.cats)){
    throw new Error('invalid');
   }

   if(!confirm('Ներմուծել backup-ը և պահպանել տվյալները?'))return;

   pros=data.pros.map(normalizePro);
   packs=data.packs.map(normalizePack);
   cats=data.cats;
   budgetPacks=Array.isArray(data.budgetPacks)?data.budgetPacks.map(normalizeBudget):[];

   if(data.current)current=data.current;
   if(data.budgetDraft)budgetDraft=data.budgetDraft;

   savePros();
   savePacks();
   saveCats();
   saveBudgetPacks();
   saveWorkState();
   saveFullBackup();

   renderHome();
   alert('Backup-ը վերականգնվեց։');
  }catch(err){
   alert('Backup ֆայլը սխալ է։');
  }
 };
 reader.readAsText(file);
}

function mergeByName(local,cloud,prefix){
 const map=new Map();

 [...local,...cloud].forEach(item=>{
  if(!item)return;
  const key=String(item.id||'').trim() || prefix+String(item.name||'').trim().toLowerCase();

  if(!map.has(key)){
   map.set(key,clone(item));
  }else{
   const old=map.get(key);
   const merged=Object.assign({},old,item);
   if(Array.isArray(old.staff)||Array.isArray(item.staff)){
    merged.staff=Array.isArray(item.staff)&&item.staff.length>=((old.staff||[]).length)
      ?clone(item.staff):clone(old.staff||[]);
   }
   map.set(key,merged);
  }
 });

 return Array.from(map.values());
}

function mergeCats(local,cloud){
 const out=[];
 [...local,...cloud].forEach(c=>{
  if(c&&!out.includes(c))out.push(c);
 });
 DEFAULT_CATS.forEach(c=>{
  if(!out.includes(c))out.push(c);
 });
 return out;
}

function scheduleCloudSave(){
 if(!cloudReady||cloudApplying)return;
 clearTimeout(cloudTimer);

}

async function saveCloud(){
 if(!window.momentooDB||!window.momentooAuth||!cloudReady||cloudApplying)return false;

 try{
  if(!momentooAuth.currentUser)await momentooAuth.signInAnonymously();

  const root=momentooDB.collection('momentoo');

  const [pd,pk,cd,bd,wd]=await Promise.all([
   root.doc('pros').get(),
   root.doc('packs').get(),
   root.doc('cats').get(),
   root.doc('budgetPacks').get(),
   root.doc('work').get()
  ]);

  const cp=pd.exists&&Array.isArray(pd.data().data)?pd.data().data:[];
  const ck=pk.exists&&Array.isArray(pk.data().data)?pk.data().data:[];
  const cc=cd.exists&&Array.isArray(cd.data().data)?cd.data().data:[];
  const cb=bd.exists&&Array.isArray(bd.data().data)?bd.data().data:[];

  const mergedPros=mergeByName(pros,cp,'pro:');
  const mergedPacks=mergeByName(packs,ck,'pack:');
  const mergedCats=mergeCats(cats,cc);
  const mergedBudget=mergeByName(budgetPacks,cb,'budget:');

  const ts=Date.now();
  const batch=momentooDB.batch();

  batch.set(root.doc('pros'),{data:mergedPros,updatedAt:ts});
  batch.set(root.doc('packs'),{data:mergedPacks,updatedAt:ts});
  batch.set(root.doc('cats'),{data:mergedCats,updatedAt:ts});
  batch.set(root.doc('budgetPacks'),{data:mergedBudget,updatedAt:ts});
  batch.set(root.doc('work'),{
   current:current||{},
   budgetDraft:budgetDraft||{},
   updatedAt:ts
  });

  batch.set(root.doc('meta'),{
   ready:true,
   version:30,
   updatedAt:ts
  },{merge:true});

  await batch.commit();

  pros=mergedPros;
  packs=mergedPacks;
  cats=mergedCats;
  budgetPacks=mergedBudget;

  localStorage.setItem(PRO_KEY,JSON.stringify(pros));
  localStorage.setItem(PACK_KEY,JSON.stringify(packs));
  localStorage.setItem(CAT_KEY,JSON.stringify(cats));
  localStorage.setItem(BUDGET_KEY,JSON.stringify(budgetPacks));
  saveFullBackup();

  return true;
 }catch(e){
  console.error('Firebase save error:',e);
  return false;
 }
}

async function loadCloud(){
 if(!window.momentooDB||!window.momentooAuth)return;

 try{
  cloudApplying=true;

  if(!momentooAuth.currentUser)await momentooAuth.signInAnonymously();

  const root=momentooDB.collection('momentoo');

  const [pd,pk,cd,bd,wd]=await Promise.all([
   root.doc('pros').get(),
   root.doc('packs').get(),
   root.doc('cats').get(),
   root.doc('budgetPacks').get(),
   root.doc('work').get()
  ]);

  const cp=pd.exists&&Array.isArray(pd.data().data)?pd.data().data:[];
  const ck=pk.exists&&Array.isArray(pk.data().data)?pk.data().data:[];
  const cc=cd.exists&&Array.isArray(cd.data().data)?cd.data().data:[];
  const cb=bd.exists&&Array.isArray(bd.data().data)?bd.data().data:[];

  /* Կարևոր՝ cloud-ը երբեք դատարկ տվյալով չի փոխարինում առկա տվյալները։ */
  pros=mergeByName(pros,cp,'pro:');
  packs=mergeByName(packs,ck,'pack:');
  cats=mergeCats(cats,cc);
  budgetPacks=mergeByName(budgetPacks,cb,'budget:');

  if(wd.exists){
   const w=wd.data();
   if(w.current&&(w.current.staff||[]).length>=(current.staff||[]).length){
    current=clone(w.current);
   }
   if(w.budgetDraft&&(w.budgetDraft.staff||[]).length>=(budgetDraft.staff||[]).length){
    budgetDraft=clone(w.budgetDraft);
   }
  }

  localStorage.setItem(PRO_KEY,JSON.stringify(pros));
  localStorage.setItem(PACK_KEY,JSON.stringify(packs));
  localStorage.setItem(CAT_KEY,JSON.stringify(cats));
  localStorage.setItem(BUDGET_KEY,JSON.stringify(budgetPacks));
  saveWorkState();

  cloudApplying=false;

  renderHome();

  await saveCloud();

 }catch(e){
  cloudApplying=false;
  console.error('Firebase load error:',e);
 }
}

async function initCloud(){
 if(!window.momentooAuth||!window.momentooDB)return;

 try{
  await momentooAuth.signInAnonymously();
  cloudReady=true;

  const root=momentooDB.collection('momentoo');
  const meta=await root.doc('meta').get();

  if(meta.exists&&meta.data()?.ready===true){
   await loadCloud();
  }else{
   /* Առաջին sync-ը պահպանում է սարքում արդեն եղած ամբողջ տվյալները։ */
   await saveCloud();
  }

 }catch(e){
  cloudReady=false;
  console.error('Firebase auth/sync error:',e);
 }
}

async function forceHomeCloudSync(){
 if(!window.momentooAuth||!window.momentooDB)return;

 try{
  if(!momentooAuth.currentUser)await momentooAuth.signInAnonymously();
  cloudReady=true;

  const root=momentooDB.collection('momentoo');
  const meta=await root.doc('meta').get();

  if(meta.exists&&meta.data()?.ready===true){
   await loadCloud();
  }else{
   await saveCloud();
  }
 }catch(e){
  console.error('Home sync error:',e);
 }
}

function initFirebase(){
 try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);

  window.momentooAuth=firebase.auth();
  window.momentooDB=firebase.firestore();

  momentooDB.settings({experimentalForceLongPolling:true});

  initCloud();
 }catch(e){
  console.error('Firebase init error:',e);
 }
}

window.addEventListener('online',()=>{
 if(cloudReady)saveCloud();
});

window.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&cloudReady){
  setTimeout(()=>saveCloud(),500);
 }
});

window.addEventListener('beforeunload',()=>{
 saveWorkState();
});

load();
initFirebase();

setTimeout(()=>{
 forceHomeCloudSync();
},2500);

if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./service-worker.js')
   .then(r=>{
    r.update();
    if(r.waiting)r.waiting.postMessage({type:'SKIP_WAITING'});
   })
   .catch(e=>console.error('SW:',e));
 });
}
</script>
</body>
