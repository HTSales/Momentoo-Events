<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#fff7fa;
color:#49343e
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1050px;margin:auto;padding:12px}

.hero{

padding:20px;

margin:0;

}
.hero p{margin:8px 0 15px;font-weight:700}

.quick{

border-radius:14px;

color:#563d49;

}

section.card,.card{

padding:14px;

.hidden{display:none!important}

.section-title{

}

.row{

align-items:center;
gap:7px;

.grid{
display:grid;

input,select{
width:100%;

border:1px solid #ead6df;

background:white;
color:#49343e;

label{

.btn,.btn2{

.btn{background:#563d49;color:#fff}

.pink{background:#e77fa3}

.blue{background:#5975d6}

#cats{

margin:7px 0

#cats .cat{

align-items:center;

width:auto;
margin:0;
padding:6px 7px;

#cats .cat .cat-name{
white-space:nowrap;
font-size:12px;

#cats .cat .cat-count{
font-size:9px;
color:#9a858e
}

#cats .cat .cat-actions{
display:flex;
gap:3px
}

#cats .cat .cat-actions button{
padding:4px 6px;
font-size:10px;

#prosList{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:7px
}

.pro{
border:1px solid #efdfe5;
border-radius:15px;
padding:10px;
background:#fff9fb;
min-width:0

.pro-head{
display:flex;

gap:7px;
align-items:flex-start

.pro-name{
font-size:14px;
font-weight:900
}

.pro-price-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px;
margin-top:7px
}

.pro-price-grid>div{
background:#fff;
border-radius:9px;
padding:6px;

}

.pro-price-grid b{

}

.pro-actions{
display:flex;
gap:4px;
margin-top:7px
}

.pro-actions button{
flex:1;
padding:6px 5px;
font-size:10px
}

.staff{
border:1px solid #efdfe5;
border-radius:15px;
padding:11px;
margin:7px 0;
background:#fff9fb
}

.staff-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:8px
}

.picker-cats{
display:flex;
gap:6px;
overflow-x:auto;
padding:2px 0 9px
}

.picker-cat{
white-space:nowrap;
border:1px solid #efd9e2;
background:#fff7fa;
color:#684552;
border-radius:999px;
padding:7px 10px;
font-size:11px;
font-weight:800
}

.picker-cat.active{
background:#e77fa3;
border-color:#e77fa3;
color:#fff
}

.summary{
background:#fbf2f6;
border-radius:17px;
padding:13px;
margin:9px 0
}

.summary-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}

.summary-item{
background:#fff;
border-radius:11px;
padding:8px
}

.summary-item span{
display:block;
font-size:10px;
color:#8b7881
}

.summary-item strong{
font-size:14px
}

.danger{color:#d04b4b!important}

.saved{
border:1px solid #eedee5;
border-radius:16px;
padding:12px;
margin:8px 0;

}

.toast{
position:fixed;
left:50%;
bottom:20px;
transform:translateX(-50%);
background:#30262b;
color:#fff;
padding:11px 16px;

z-index:9999;
font-size:13px
}

@media(max-width:600px){
.wrap{padding:9px}
.hero{padding:18px}
.quick{gap:6px}
.quick button{font-size:12px;padding:11px 5px}
#prosList{grid-template-columns:repeat(2,minmax(0,1fr))}
.summary-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:380px){
#prosList{grid-template-columns:1fr}
}
</style>

<script>
const FIREBASE={
apiKey:'AIzaSyBka_OD8XoM5X6K-zw2SjejfMXTeHzwC0',
authDomain:'momentoo-events.firebaseapp.com',
projectId:'momentoo-events',
storageBucket:'momentoo-events.firebasestorage.app',
messagingSenderId:'111582575594',
appId:'1:111582575594:web:682c651a0cb1e5cc3d9093'
};

const CATS=[
'DJ-ներ',
'Ջութակահարներ',
'Ռիլմեյքերներ',
'Լուսանկարիչներ',
'Դրոն նկարահանում',
'Ֆոտոզոնա / Դեկոր',
'Պարային շոուներ',
'Արջուկներ / կերպարներ',
'Երաժիշտներ',
'Ծաղիկներ',
'Այլ'
];

let pros=[];
let packages=[];
let budgets=[];
let categories=[];

let normal={
id:null,
name:'',
staff:[]
};

let budget={
id:null,
name:'',
limit:0,
staff:[]
};

let editProId=null;
let pickerType='';
let pickerCategory='';
let categoryFilter='';

const $=id=>document.getElementById(id);

function n(v){
return Math.max(0,Number(String(v??'').replace(/[^\d]/g,''))||0)
}

function money(v){
return n(v).toLocaleString('en-US')+' ֏'
}

function id(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8)
}

function copy(x){
return JSON.parse(JSON.stringify(x))
}

function esc(x){
return String(x??'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
}

function notify(text){
$('toast').textContent=text;
$('toast').classList.remove('hidden');

clearTimeout(window.tt);
window.tt=setTimeout(()=>$('toast').classList.add('hidden'),2000);
}

function saveLocal(){
localStorage.setItem('momentoo_pros',JSON.stringify(pros));
localStorage.setItem('momentoo_packages',JSON.stringify(packages));
localStorage.setItem('momentoo_budgets',JSON.stringify(budgets));
localStorage.setItem('momentoo_categories',JSON.stringify(categories));
localStorage.setItem('momentoo_normal',JSON.stringify(normal));
localStorage.setItem('momentoo_budget',JSON.stringify(budget));
saveBackupLocal();
cloudSaveSoon();
}

function saveBackupLocal(){
localStorage.setItem(
'momentoo_full_backup',
JSON.stringify({
date:new Date().toISOString(),
pros,
packages,
budgets,
categories,
normal,
budget
})
)
}

function loadLocal(){
try{
pros=JSON.parse(localStorage.getItem('momentoo_pros')||'[]');
packages=JSON.parse(localStorage.getItem('momentoo_packages')||'[]');
budgets=JSON.parse(localStorage.getItem('momentoo_budgets')||'[]');
categories=JSON.parse(localStorage.getItem('momentoo_categories')||'[]');

normal=JSON.parse(
localStorage.getItem('momentoo_normal')||
'{"id":null,"name":"","staff":[]}'
);

budget=JSON.parse(
localStorage.getItem('momentoo_budget')||
'{"id":null,"name":"","limit":0,"staff":[]}'
);
}catch(e){
pros=[];
packages=[];
budgets=[];
categories=[];
normal={id:null,name:'',staff:[]};
budget={id:null,name:'',limit:0,staff:[]};
}

if(!Array.isArray(categories)||!categories.length){
categories=CATS.slice();
}

if(!Array.isArray(pros))pros=[];
if(!Array.isArray(packages))packages=[];
if(!Array.isArray(budgets))budgets=[];

renderEverything();
}

function renderEverything(){
renderCategories();
renderCategorySelect();
renderPros();
renderPackages();
renderNormalEditor();
renderBudget();
renderBudgets();
renderPayments();
updateProProfit();
}

function hidePages(){
[
'prosPage',
'packagesPage',
'budgetPage',
'budgetSavedPage',
'paymentsPage',
'backupPage',
'pickerPage'
].forEach(x=>$(x).classList.add('hidden'))
}

function page(id){
hidePages();
$(id).classList.remove('hidden');
window.scrollTo({top:0,behavior:'smooth'});
}

function openPros(){
page('prosPage');
categoryFilter='';
renderPros();
}

function openPackages(){
page('packagesPage');
renderPackages();
}

function openBudgetSaved(){
page('budgetSavedPage');
renderBudgets();
}

function openPayments(){
page('paymentsPage');
renderPayments();
}

function openBackup(){
page('backupPage');
}

function newNormal(){
normal={id:null,name:'',staff:[]};
$('normalName').value='';
page('packagesPage');
renderNormalEditor();
}

function newBudget(){
budget={id:null,name:'',limit:0,staff:[]};
$('budgetName').value='';
$('budgetLimit').value='';
page('budgetPage');
renderBudget();
}

function renderCategorySelect(){
$('proCategory').innerHTML=
categories.map(x=>
`<option value="${esc(x)}">${esc(x)}</option>`
).join('');
}

function addCategory(){
const input=$('newCategory');
const name=input.value.trim();

if(!name)return;

if(categories.some(x=>x.toLowerCase()===name.toLowerCase())){
alert('Այս բաժինը արդեն կա');
return;
}

categories.push(name);
input.value='';

saveLocal();
renderEverything();
notify('Բաժինը ավելացվեց');
}

function renameCategory(old){
const name=prompt('Նոր անունը',old);

if(name===null)return;

const x=name.trim();

if(!x||x===old)return;

if(categories.some(c=>c.toLowerCase()===x.toLowerCase())){
alert('Այս անունով բաժին արդեն կա');
return;
}

categories=categories.map(c=>c===old?x:c);

pros.forEach(p=>{
if(p.category===old)p.category=x;
});

packages.forEach(p=>{
p.staff?.forEach(s=>{
if(s.category===old)s.category=x;
});
});

budgets.forEach(p=>{
p.staff?.forEach(s=>{
if(s.category===old)s.category=x;
});
});

saveLocal();
renderEverything();
}

function deleteCategory(name){
if(pros.some(p=>p.category===name)){
alert('Այս բաժնում մասնագետներ կան։ Նախ տեղափոխիր կամ ջնջիր մասնագետներին։');
return;
}

if(!confirm('Ջնջե՞լ բաժինը'))return;

categories=categories.filter(x=>x!==name);

saveLocal();
renderEverything();
}

function openCategory(name){
categoryFilter=name;
openPros();
}

function renderCategories(){
const b=$('cats');

b.innerHTML=categories.map(c=>{
const count=pros.filter(p=>p.category===c).length;

return `
<div class="cat">
<span class="cat-name">${esc(c)}</span>
<span class="cat-count">(${count})</span>

<div class="cat-actions">
<button class="btn blue"
onclick='openCategory(${JSON.stringify(c)})'>
👥
</button>

<button class="btn2"
onclick='renameCategory(${JSON.stringify(c)})'>
✏️
</button>

<button class="btn red"
onclick='deleteCategory(${JSON.stringify(c)})'>
🗑
</button>
</div>
</div>
`
}).join('');
}

function savePro(){
const name=$('proName').value.trim();
const category=$('proCategory').value;
const market=n($('proMarket').value);
const min=n($('proMin').value);

if(!name){
alert('Գրիր մասնագետի անունը');
return;
}

if(!market){
alert('Գրիր շուկայական գինը');
return;
}

if(min>market){
alert('Մինիմալ գինը չի կարող մեծ լինել շուկայականից');
return;
}

if(editProId){
const p=pros.find(x=>x.id===editProId);

if(p){
p.name=name;
p.category=category;
p.market=market;
p.min=min;
}
}else{
pros.push({
id:id(),
name,
category,
market,
min
});
}

editProId=null;

$('proFormTitle').textContent='➕ Ավելացնել մասնագետ';

function importData(e){
const file=e.target.files?.[0];

if(!file)return;

const r=new FileReader();

r.onload=()=>{
try{
const d=JSON.parse(r.result);

if(Array.isArray(d.pros))pros=d.pros;
if(Array.isArray(d.packages))packages=d.packages;
if(Array.isArray(d.budgets))budgets=d.budgets;
if(Array.isArray(d.categories))categories=d.categories;
if(d.normal)normal=d.normal;
if(d.budget)budget=d.budget;

renderEverything();

alert('Backup-ը ներմուծվեց');
}catch(err){
alert('Backup-ի ֆայլը սխալ է');
}
};

r.readAsText(file);
}

let cloudReady=false;
let cloudTimer=null;

try{
firebase.initializeApp(FIREBASE);
window.db=firebase.firestore();
window.auth=firebase.auth();

try{
db.settings({
experimentalForceLongPolling:true
});
}catch(e){}
}catch(e){
console.error(e);
}

function cloudSaveSoon(){
if(!cloudReady)return;

clearTimeout(cloudTimer);

cloudTimer=setTimeout(cloudSave,800);
}

async function cloudSave(){
if(!cloudReady)return;

try{
if(!auth.currentUser){
await auth.signInAnonymously();
}

const root=db.collection('momentoo');
const batch=db.batch();
const time=firebase.firestore.FieldValue.serverTimestamp();

batch.set(
root.doc('pros'),
{data:pros,updatedAt:time}
);

batch.set(
root.doc('packs'),
{data:packages,updatedAt:time}
);

batch.set(
root.doc('cats'),
{data:categories,updatedAt:time}
);

batch.set(
root.doc('budgetPacks'),
{data:budgets,updatedAt:time}
);

batch.set(
root.doc('work'),
{
normal,
budget,
updatedAt:time
}
);

batch.set(
root.doc('meta'),
{
ready:true,
version:40,
updatedAt:time
},
{merge:true}
);

await batch.commit();

}catch(e){
console.error('Cloud save:',e);
}
}

async function cloudLoad(){
if(!window.db||!window.auth)return;

try{
if(!auth.currentUser){
await auth.signInAnonymously();
}

const root=db.collection('momentoo');

const[
p,
pk,
c,
b,
w
]=await Promise.all([
root.doc('pros').get(),
root.doc('packs').get(),
root.doc('cats').get(),
root.doc('budgetPacks').get(),
root.doc('work').get()
]);

if(p.exists&&Array.isArray(p.data().data)){
const remote=p.data().data;

const map=new Map();

[...remote,...pros].forEach(x=>{
if(x?.id&&!map.has(x.id))map.set(x.id,x);
});

pros=[...map.values()];
}

if(pk.exists&&Array.isArray(pk.data().data)){
const remote=pk.data().data;

const map=new Map();

[...remote,...packages].forEach(x=>{
if(x?.id&&!map.has(x.id))map.set(x.id,x);
});

packages=[...map.values()];
}

if(c.exists&&Array.isArray(c.data().data)){
const remote=c.data().data;

categories=[...new Set([
...remote,
...categories
])];
}

if(b.exists&&Array.isArray(b.data().data)){
const remote=b.data().data;

const map=new Map();

[...remote,...budgets].forEach(x=>{
if(x?.id&&!map.has(x.id))map.set(x.id,x);
});

budgets=[...map.values()];
}

if(w.exists){
const x=w.data();

if(x.normal)normal=x.normal;
if(x.budget)budget=x.budget;
}

saveLocal();
renderEverything();
await cloudSave();

}catch(e){
console.error('Cloud load:',e);
}
}

async function initCloud(){
if(!window.db||!window.auth)return;

try{
await auth.signInAnonymously();
cloudReady=true;

const meta=await db
.collection('momentoo')
.doc('meta')
.get();

if(meta.exists&&meta.data()?.ready){
await cloudLoad();
}else{
await cloudSave();
}
}catch(e){
console.error('Firebase:',e);
}
}

window.addEventListener('online',()=>{
if(cloudReady)cloudSave();
});

window.addEventListener('beforeunload',saveLocal);

load();
initCloud();
</script>
