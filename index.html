<!doctype html><html lang="hy"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e77fa3"><title>MOMENTOO EVENTS</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7fa;color:#513946;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:12px}.hero{padding:22px 16px;border-radius:25px;background:linear-gradient(135deg,#ffc4d5,#ffe1d5,#fff0bd);margin-bottom:10px}.hero h1{margin:0;font-size:clamp(34px,8vw,62px);font-weight:900}.hero p{font-weight:700}.quick,.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.tabs{display:flex;overflow:auto;margin:8px 0}.btn,.btn2{border-radius:12px;padding:10px 12px;font-weight:800;border:0;background:#563d49;color:#fff}.btn2{background:#fff;color:#563d49;border:1px solid #ead6df}.pink{background:#e77fa3}.green{background:#3d9a63}.blue{background:#5b75d8}.red{background:#d65050}.yellow{background:#fff0bd;color:#725716}.card{background:#fff;border-radius:22px;padding:14px;margin:9px 0;box-shadow:0 4px 18px #5a304010}input,select{width:100%;padding:11px;border:1px solid #ead6df;border-radius:14px;background:#fff;color:#513946}label{display:block;margin:8px 0 4px;font-size:13px;font-weight:800;color:#796670}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.small{font-size:12px;color:#8a7780}.badge{padding:5px 8px;border-radius:9px;background:#f7edf2;font-size:11px;font-weight:800}.hidden{display:none!important}.title{display:flex;justify-content:space-between;align-items:center}.total{font-size:19px;font-weight:900}.summary{background:#fbf1f6;border-radius:18px;padding:13px}.cats{display:flex;flex-wrap:wrap;gap:6px}.catpill,.picker{border:1px solid #efd9e2;background:#fff7fa;color:#684552;border-radius:999px;padding:7px 10px;font-weight:800;font-size:12px}.active{background:#e77fa3!important;color:#fff!important;border-color:#e77fa3!important}.pros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.pro{background:#fff7fa;border:1px solid #efd9e2;border-radius:15px;padding:9px;min-width:0}.pro b{font-size:13px}.pickerbox{display:flex;flex-wrap:wrap;gap:6px}.staff{display:flex;justify-content:space-between;gap:7px;align-items:center;border:1px solid #f0e2e8;background:#fff7fa;border-radius:13px;padding:9px;margin:5px 0}.budgetrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.danger{color:#c94444;font-weight:800}@media(max-width:520px){.pros{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.budgetrow{grid-template-columns:1fr}.btn,.btn2{padding:9px 10px}}
</style><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script></head><body><div class="wrap">
<div class="hero"><h1>MOMENTOO EVENTS</h1><div>✨</div><p>Ստեղծում ենք հիշվող անակնկալներ...</p><div class="quick"><button class="btn pink" onclick="newPack()">＋ Նոր փաթեթ</button><button class="btn2" onclick="show('pros')">👥 Մասնագետներ</button><button class="btn2" onclick="show('pros')">📂 Բաժիններ</button><button class="btn2" onclick="show('packs')">📦 Փաթեթներ</button><button class="btn yellow" onclick="newBudget()">💰 Բյուջետային փաթեթ</button><button class="btn2" onclick="show('payments')">💸 Վճարումներ</button></div></div>
<div class="tabs"><button class="btn2" onclick="show('pros')">Մասնագետներ</button><button class="btn2" onclick="show('packs')">Փաթեթներ</button><button class="btn2" onclick="newBudget()">Բյուջե</button><button class="btn2" onclick="show('savedBudget')">Բյուջեի փաթեթներ</button><button class="btn2" onclick="show('payments')">Վճարումներ</button><button class="btn2" onclick="show('backup')">Backup</button></div>
<section id="pros" class="card"><div class="title"><h2>👥 Մասնագետներ</h2><span id="count" class="badge">0</span></div><div class="card"><h3 id="proTitle">➕ Ավելացնել մասնագետ</h3><label>Անուն / անվանում</label><input id="pn" placeholder="Օր․ Նվեր"><label>Բաժին</label><select id="pc"></select><div class="grid"><div><label>Շուկայական գին</label><input id="pmax" inputmode="numeric"></div><div><label>Մինիմալ գին</label><input id="pmin" inputmode="numeric"></div></div><div class="small">Իմ գումարը = շուկայական − մինիմալ</div><b id="derived">Իմ գումարը՝ 0 ֏</b><div class="row"><button class="btn green" onclick="savePro()">Պահպանել</button><button id="cancel" class="btn2 hidden" onclick="cancelPro()">Չեղարկել</button></div></div><div class="card"><h3>📂 Բաժիններ</h3><div id="cats" class="cats"></div><input id="newcat" placeholder="Նոր բաժնի անուն"><button class="btn blue" onclick="addCat()">＋ Ավելացնել բաժին</button></div><div class="card"><h3>👤 Մասնագետների ցանկ</h3><div id="prosList" class="pros"></div></div></section>
<section id="packs" class="card hidden"><div class="title"><h2>📦 Փաթեթ</h2><button class="btn2" onclick="show('pros')">←</button></div><label>Փաթեթի անուն</label><input id="packname" placeholder="Օր․ Երեխայի ծնունդ"><div class="row"><button class="btn blue" onclick="openPicker('normal')">＋ Ավելացնել մասնագետ</button><button class="btn green" onclick="savePack()">💾 Պահպանել</button></div><div id="packstaff"></div><div id="packsum" class="summary"></div><div id="savedpacks"></div></section>
<section id="budget" class="card hidden"><div class="title"><h2>💰 Բյուջետային փաթեթ</h2><button class="btn2" onclick="show('pros')">←</button></div><label>Փաթեթի անուն</label><input id="bname" placeholder="Օր․ Ծնունդ"><label>Հաճախորդի բյուջե</label><input id="budgetInput" inputmode="numeric"><div class="row"><button class="btn blue" onclick="openPicker('budget')">＋ Ավելացնել մասնագետ</button><button class="btn green" onclick="saveBudget()">💾 Պահպանել</button></div><div id="bstaff"></div><div id="bsum" class="summary"></div></section>
<section id="savedBudget" class="card hidden"><h2>💰 Պահպանված բյուջեի փաթեթներ</h2><div id="budgetList"></div></section><section id="payments" class="card hidden"><h2>💸 Վճարումներ</h2><div id="paymentsList"></div></section><section id="backup" class="card hidden"><h2>💾 Backup / Import</h2><button class="btn blue" onclick="backup()">📥 Backup</button><label>Import JSON</label><input type="file" accept="application/json" onchange="restore(event)"></section>
<div id="picker" class="card hidden"><div class="title"><h3 id="pickerTitle">Ընտրել մասնագետ</h3><button class="btn2" onclick="closePicker()">✕</button></div><div id="pickerCats" class="pickerbox"></div><div id="pickerPros"></div></div></div>
<script>
const DEFAULT=['DJ-ներ','Ջութակահարներ','Ռիլմեյքերներ','Լուսանկարիչներ','Դրոն նկարահանում','Ֆոտոզոնա / Դեկոր','Պարային շոուներ','Արջուկներ / կերպարներ','Երաժիշտներ','Ծաղիկներ','Այլ'];let cats=JSON.parse(localStorage.cats||'null')||DEFAULT.slice(),pros=JSON.parse(localStorage.pros||'[]'),packs=JSON.parse(localStorage.packs||'[]'),budgets=JSON.parse(localStorage.budgets||'[]'),current=JSON.parse(localStorage.current||'null')||{name:'',staff:[]},budget=JSON.parse(localStorage.budget||'null')||{name:'',total:0,staff:[]},editPro=null,pickerMode='',pickerCat='';
const $=id=>document.getElementById(id),n=x=>Math.max(0,parseInt(String(x??'').replace(/[^0-9]/g,''))||0),money=x=>n(x).toLocaleString('hy-AM')+' ֏',id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.cats=JSON.stringify(cats);localStorage.pros=JSON.stringify(pros);localStorage.packs=JSON.stringify(packs);localStorage.budgets=JSON.stringify(budgets);localStorage.current=JSON.stringify(current);localStorage.budget=JSON.stringify(budget);cloudSave()}
function show(x){['pros','packs','budget','savedBudget','payments','backup'].forEach(i=>$(i).classList.toggle('hidden',i!==x));if(x==='pros')renderPros();if(x==='packs')renderPack();if(x==='savedBudget')renderBudgets();if(x==='payments')renderPayments()}
function renderCats(){$('cats').innerHTML=cats.map(c=>`<button class="catpill ${pickerCat===c?'active':''}" onclick="manageCat(${JSON.stringify(c)})">${esc(c)} (${pros.filter(p=>p.cat===c).length})</button>`).join('')}
function manageCat(c){pickerCat=pickerCat===c?'':c;renderPros()}
function renderPros(){$('count').textContent=pros.length;renderCats();$('pc').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');let a=pickerCat?pros.filter(p=>p.cat===pickerCat):pros;$('prosList').innerHTML=a.length?a.map(p=>`<div class="pro"><b>${esc(p.name)}</b><div class="small">${esc(p.cat)}</div><div class="small">Շուկա՝ ${money(p.max)} · Մին՝ ${money(p.min)}</div><div>Իմ գումարը՝ <b>${money(n(p.max)-n(p.min))}</b></div><div class="row"><button class="btn2" onclick="editP(${JSON.stringify(p.id)})">✏️</button><button class="btn red" onclick="delP(${JSON.stringify(p.id)})">🗑</button></div></div>`).join(''):'<div class="small">Մասնագետ չկա</div>'}
function savePro(){let name=$('pn').value.trim(),cat=$('pc').value,max=n($('pmax').value),min=n($('pmin').value);if(!name||!max)return alert('Լրացրու անունը և շուկայական գինը');if(min>max)return alert('Մինիմալ գինը չի կարող մեծ լինել շուկայականից');if(editPro){let p=pros.find(x=>x.id===editPro);Object.assign(p,{name,cat,max,min})}else pros.push({id:id(),name,cat,max,min});editPro=null;$('proTitle').textContent='➕ Ավելացնել մասնագետ';$('cancel').classList.add('hidden');$('pn').value=$('pmax').value=$('pmin').value='';save();renderPros()}
function editP(i){let p=pros.find(x=>x.id===i);if(!p)return;editPro=i;$('proTitle').textContent='✏️ Խմբագրել մասնագետին';$('cancel').classList.remove('hidden');$('pn').value=p.name;$('pc').value=p.cat;$('pmax').value=p.max;$('pmin').value=p.min;upd();scrollTo(0,0)}function cancelPro(){editPro=null;$('proTitle').textContent='➕ Ավելացնել մասնագետ';$('cancel').classList.add('hidden');$('pn').value=$('pmax').value=$('pmin').value='';upd()}function delP(i){if(confirm('Ջնջե՞լ մասնագետին')){pros=pros.filter(p=>p.id!==i);save();renderPros()}}function upd(){$('derived').textContent='Իմ գումարը՝ '+money(Math.max(0,n($('pmax').value)-n($('pmin').value)))}$('pmax').oninput=upd;$('pmin').oninput=upd;
function addCat(){let x=$('newcat').value.trim();if(!x)return;if(cats.includes(x))return alert('Այս բաժինն արդեն կա');cats.push(x);$('newcat').value='';save();renderPros()}
function openPicker(mode){pickerMode=mode;pickerCat='';$('picker').classList.remove('hidden');$('pickerTitle').textContent=mode==='budget'?'💰 Ընտրել մասնագետ':'📦 Ընտրել մասնագետ';renderPicker()}
function closePicker(){$('picker').classList.add('hidden')}
function renderPicker(){$('pickerCats').innerHTML=cats.map(c=>`<button class="picker ${pickerCat===c?'active':''}" onclick="pickerCat=${JSON.stringify(c)};renderPicker()">${esc(c)} (${pros.filter(p=>p.cat===c).length})</button>`).join('');$('pickerPros').innerHTML=pickerCat?pros.filter(p=>p.cat===pickerCat).map(p=>`<div class="staff"><div><b>${esc(p.name)}</b><div class="small">Շուկա ${money(p.max)} · Մին ${money(p.min)}</div></div><button class="btn green" onclick="pick(${JSON.stringify(p.id)})">＋</button></div>`).join(''):'<div class="small">Ընտրիր բաժին</div>'}
function pick(i){let p=pros.find(x=>x.id===i);if(!p)return;if(pickerMode==='normal'){if(current.staff.some(x=>x.pid===i))return alert('Արդեն ավելացված է');current.staff.push({id:id(),pid:i,name:p.name,cat:p.cat,market:p.max,cost:p.min,profit:n(p.max)-n(p.min)});renderPack()}else{if(budget.staff.some(x=>x.pid===i))return alert('Արդեն ավելացված է');budget.staff.push({id:id(),pid:i,name:p.name,cat:p.cat,market:p.max,cost:p.min,profit:n(p.max)-n(p.min)});renderBudget()}save()}
function newPack(){current={name:'',staff:[]};$('packname').value='';save();show('packs')}
$('packname').oninput=()=>{current.name=$('packname').value;save()};$('bname').oninput=()=>{budget.name=$('bname').value;save()};$('budgetInput').oninput=()=>{budget.total=n($('budgetInput').value);renderBudget();save()};
function renderPack(){$('packname').value=current.name||'';$('packstaff').innerHTML=current.staff.length?current.staff.map((s,i)=>`<div class="staff"><div><b>${esc(s.name)}</b><div class="small">${esc(s.cat)} · Շուկա ${money(s.market)}</div><input value="${n(s.cost)}" inputmode="numeric" onchange="packCost(${i},this.value)"></div><button class="btn red" onclick="current.staff.splice(${i},1);save();renderPack()">🗑</button></div>`).join(''):'<div class="small">Մասնագետներ չկան</div>';let market=current.staff.reduce((a,s)=>a+n(s.market),0),cost=current.staff.reduce((a,s)=>a+n(s.cost),0);$('packsum').innerHTML=`<div>Հաճախորդից՝ <b>${money(market)}</b></div><div>Մասնագետներին՝ <b>${money(cost)}</b></div><div>Իմ գումարը՝ <b>${money(Math.max(0,market-cost))}</b></div>`;$('savedpacks').innerHTML='<h3>Պահպանված փաթեթներ</h3>'+packs.map(p=>`<div class="staff"><div><b>${esc(p.name)}</b><div class="small">${p.staff.length} մասնագետ · ${money(p.staff.reduce((a,s)=>a+n(s.market),0))}</div></div><button class="btn2" onclick="loadPack(${JSON.stringify(p.id)})">Բացել</button></div>`).join('')}
function packCost(i,v){current.staff[i].cost=Math.min(n(v),n(current.staff[i].market));current.staff[i].profit=n(current.staff[i].market)-current.staff[i].cost;save();renderPack()}function savePack(){if(!current.name.trim())return alert('Գրիր փաթեթի անունը');let p={...current,id:current.id||id()};packs=packs.filter(x=>x.id!==p.id);packs.push(JSON.parse(JSON.stringify(p)));current=p;save();renderPack();alert('Փաթեթը պահպանվեց')}function loadPack(i){let p=packs.find(x=>x.id===i);if(!p)return;current=JSON.parse(JSON.stringify(p));show('packs')}
function newBudget(){budget={name:'',total:0,staff:[]};$('bname').value='';$('budgetInput').value='';save();show('budget')}
function budgetTotals(){let cost=budget.staff.reduce((a,s)=>a+n(s.cost),0),profit=budget.staff.reduce((a,s)=>a+n(s.profit),0),charge=cost+profit;return{cost,profit,charge,remaining:n(budget.total)-charge}}
function renderBudget(){$('bname').value=budget.name||'';$('budgetInput').value=budget.total||'';$('bstaff').innerHTML=budget.staff.length?budget.staff.map((s,i)=>`<div class="staff"><div style="flex:1"><b>${esc(s.name)}</b><div class="small">${esc(s.cat)} · Շուկա ${money(s.market)}</div><div class="budgetrow"><div><label>Մասնագետին</label><input value="${n(s.cost)}" inputmode="numeric" onchange="budgetCost(${i},this.value)"></div><div><label>Իմ գումարը / շահույթ</label><input value="${n(s.profit)}" inputmode="numeric" onchange="budgetProfit(${i},this.value)"></div></div></div><button class="btn red" onclick="budget.staff.splice(${i},1);save();renderBudget()">🗑</button></div>`).join(''):'<div class="small">Մասնագետներ չկան</div>';let t=budgetTotals();$('bsum').innerHTML=`<div>Բյուջե՝ <b>${money(budget.total)}</b></div><div>Մասնագետներին՝ <b>${money(t.cost)}</b></div><div>🔥 Իմ շահույթը՝ <b>${money(t.profit)}</b></div><div>Հաճախորդից՝ <b>${money(t.charge)}</b></div><div class="${t.remaining<0?'danger':''}">Մնացորդ՝ <b>${money(Math.max(0,t.remaining))}</b>${t.remaining<0?' — գերազանցում է բյուջեն':''}</div>`}
function budgetCost(i,v){let s=budget.staff[i],old=n(s.cost),cost=Math.min(n(v),n(s.market)),d=old-cost;s.cost=cost;s.profit=Math.max(0,n(s.profit)+d);if(budgetTotals().charge>n(budget.total)){let over=budgetTotals().charge-n(budget.total);s.profit=Math.max(0,s.profit-over)}save();renderBudget()}function budgetProfit(i,v){let s=budget.staff[i],newP=n(v),old=n(s.profit),limit=n(budget.total)-(budgetTotals().charge-old);s.profit=Math.max(0,Math.min(newP,Math.max(0,limit)));save();renderBudget()}
function saveBudget(){if(!budget.name.trim())return alert('Գրիր փաթեթի անունը');if(budgetTotals().charge>n(budget.total))return alert('Գումարը գերազանցում է հաճախորդի բյուջեն');let p={...JSON.parse(JSON.stringify(budget)),id:budget.id||id()};budgets=budgets.filter(x=>x.id!==p.id);budgets.push(p);budget=p;save();renderBudgets();alert('Բյուջեի փաթեթը պահպանվեց')}function renderBudgets(){$('budgetList').innerHTML=budgets.length?budgets.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="small">Բյուջե՝ ${money(p.total)} · Հաճախորդից՝ ${money(p.staff.reduce((a,s)=>a+n(s.cost)+n(s.profit),0))}</div>${p.staff.map(s=>`<div class="small">• ${esc(s.name)} — մասնագետ ${money(s.cost)} · շահույթ ${money(s.profit)}</div>`).join('')}<div class="row"><button class="btn blue" onclick="loadBudget(${JSON.stringify(p.id)})">✏️ Բացել / խմբագրել</button><button class="btn red" onclick="delBudget(${JSON.stringify(p.id)})">🗑</button></div></div>`).join(''):'<div class="small">Պահպանված բյուջեի փաթեթ չկա</div>'}function loadBudget(i){let p=budgets.find(x=>x.id===i);if(!p)return;budget=JSON.parse(JSON.stringify(p));show('budget')}function delBudget(i){if(confirm('Ջնջե՞լ')){budgets=budgets.filter(x=>x.id!==i);save();renderBudgets()}}
function renderPayments(){let m={};budgets.forEach(p=>p.staff.forEach(s=>{m[s.pid||s.name]=(m[s.pid||s.name]||0)+n(s.cost)}));$('paymentsList').innerHTML=Object.keys(m).length?Object.keys(m).map(k=>{let s=budgets.flatMap(p=>p.staff).find(x=>(x.pid||x.name)===k);return`<div class="staff"><b>${esc(s.name)}</b><b>${money(m[k])}</b></div>`}).join(''):'<div class="small">Վճարումներ չկան</div>'}
