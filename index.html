<script>
const PRO_KEY="momentoo_pros_v3";
const PACK_KEY="momentoo_packs_v6";

let professionals=[];
let savedPackages=[];
let currentPackage={id:null,name:"",staff:[]};

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function money(v){
  return (Number(v)||0).toLocaleString("hy-AM")+" ֏";
}

function esc(t){
  return String(t||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function readArray(key){
  try{
    const raw=localStorage.getItem(key);
    if(!raw) return [];
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed)?parsed:[];
  }catch(e){
    return [];
  }
}

function normalizeProfessional(p){
  const minPrice=Number(
    p.minPrice ??
    p.price ??
    p.cost ??
    0
  );

  let maxPrice=Number(
    p.maxPrice ??
    p.maximumPrice ??
    minPrice
  );

  if(maxPrice<minPrice){
    maxPrice=minPrice;
  }

  return{
    ...p,
    id:p.id||uid(),
    name:p.name||p.expertName||p.title||p.specialist||"Մասնագետ",
    type:p.type||p.profession||p.service||p.category||"",
    minPrice,
    maxPrice
  };
}

function normalizeStaff(s){
  const minPrice=Number(
    s.minPrice ??
    s.price ??
    s.cost ??
    0
  );

  let maxPrice=Number(
    s.maxPrice ??
    s.maximumPrice ??
    s.price ??
    s.cost ??
    minPrice
  );

  if(maxPrice<minPrice){
    maxPrice=minPrice;
  }

  let profit=Number(
    s.profit ??
    s.myAmount ??
    s.margin ??
    0
  );

  const maxProfit=Math.max(0,maxPrice-minPrice);

  if(profit>maxProfit){
    profit=maxProfit;
  }

  return{
    ...s,
    id:s.id||uid(),
    professionalId:s.professionalId||null,
    name:s.name||s.expertName||s.title||s.specialist||s.service||"Մասնագետ",
    type:s.type||s.profession||s.service||"",
    minPrice,
    maxPrice,
    profit
  };
}

function normalizePackage(p){
  let staff=p.staff||p.items||p.experts||p.services||[];

  if(!Array.isArray(staff)){
    staff=[];
  }

  return{
    ...p,
    id:p.id||uid(),
    name:p.name||p.packageName||p.title||"Փաթեթ",
    staff:staff.map(normalizeStaff)
  };
}


/* =========================
   LOAD
========================= */

function load(){
  professionals=readArray(PRO_KEY).map(normalizeProfessional);
  savedPackages=readArray(PACK_KEY).map(normalizePackage);

  savePros();
  savePackages();

  renderProfessionals();
  renderSaved();
  renderCurrent();
}

function savePros(){
  localStorage.setItem(PRO_KEY,JSON.stringify(professionals));
}

function savePackages(){
  localStorage.setItem(PACK_KEY,JSON.stringify(savedPackages));
}


/* =========================
   BACKUP
========================= */

function exportBackup(){
  const backup={
    exportedAt:new Date().toISOString(),
    origin:location.origin,
    href:location.href,
    allLocalStorage:{}
  };

  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);

    if(key){
      backup.allLocalStorage[key]=localStorage.getItem(key);
    }
  }

  const text=JSON.stringify(backup,null,2);

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>{
        alert("Backup-ը պատճենվեց։");
      })
      .catch(()=>{
        showBackupText(text);
      });
  }else{
    showBackupText(text);
  }
}

function showBackupText(text){
  const overlay=document.createElement("div");

  overlay.style.position="fixed";
  overlay.style.inset="0";
  overlay.style.zIndex="99999";
  overlay.style.background="rgba(30,20,25,.85)";
  overlay.style.padding="20px";
  overlay.style.overflow="auto";

  overlay.innerHTML=`
    <div style="
      background:white;
      max-width:700px;
      margin:auto;
      padding:18px;
      border-radius:20px;
    ">
      <h2>📤 Backup</h2>

      <textarea
        id="backupTextArea"
        style="width:100%;min-height:350px"
      ></textarea>

      <div style="
        display:flex;
        gap:8px;
        margin-top:10px;
      ">
        <button
          class="primary"
          onclick="
            document.getElementById('backupTextArea').select();
            document.execCommand('copy');
            alert('Պատճենվեց');
          "
        >
          Copy
        </button>

        <button
          class="danger"
          onclick="this.closest('[style*=fixed]').remove()"
        >
          Փակել
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  document.getElementById("backupTextArea").value=text;
}

function toggleImportPanel(){
  document.getElementById("importPanel").classList.toggle("hidden");
}

function importBackup(){
  const raw=document.getElementById("backupImportText").value.trim();

  if(!raw){
    alert("Paste արա Backup-ը։");
    return;
  }

  try{
    const backup=JSON.parse(raw);

    if(!backup || !backup.allLocalStorage){
      alert("Backup-ը ճիշտ չէ։");
      return;
    }

    Object.keys(backup.allLocalStorage).forEach(key=>{
      const value=backup.allLocalStorage[key];

      if(value!==null){
        localStorage.setItem(key,value);
      }
    });

    professionals=readArray(PRO_KEY).map(normalizeProfessional);
    savedPackages=readArray(PACK_KEY).map(normalizePackage);

    savePros();
    savePackages();

    renderProfessionals();
    renderSaved();
    renderCurrent();

    alert("Backup-ը ներմուծվեց։");

  }catch(e){
    alert("Backup-ը չի կարդացվում։");
  }
}


/* =========================
   ՄԱՍՆԱԳԵՏՆԵՐ
========================= */

function toggleProfessionals(){
  document
    .getElementById("professionalsPanel")
    .classList.toggle("hidden");

  renderProfessionals();
}

function addProfessional(){
  const name=document.getElementById("proName").value.trim();
  const type=document.getElementById("proType").value.trim();

  const minPrice=
    Number(document.getElementById("proMin").value)||0;

  let maxPrice=
    Number(document.getElementById("proMax").value)||0;

  if(!name){
    alert("Գրիր մասնագետի անունը։");
    return;
  }

  if(!maxPrice){
    maxPrice=minPrice;
  }

  if(maxPrice<minPrice){
    alert("Մաքսիմալ գինը չի կարող փոքր լինել մինիմալից։");
    return;
  }

  professionals.push({
    id:uid(),
    name,
    type,
    minPrice,
    maxPrice
  });

  savePros();
  renderProfessionals();

  document.getElementById("proName").value="";
  document.getElementById("proType").value="";
  document.getElementById("proMin").value="";
  document.getElementById("proMax").value="";
}


/* Այստեղ արդեն պահպանված մասնագետի
   անունն ու գները փոխվում են */

function renderProfessionals(){
  const box=document.getElementById("professionalsList");

  if(!professionals.length){
    box.innerHTML="<div>Դեռ մասնագետ չկա։</div>";
    return;
  }

  box.innerHTML=professionals.map(p=>`
    <div class="pro-row">

      <div>
        <label>Անուն</label>

        <input
          value="${esc(p.name)}"
          oninput="editProText('${p.id}','name',this.value)"
        >
      </div>

      <div>
        <label>Մասնագիտություն</label>

        <input
          value="${esc(p.type)}"
          oninput="editProText('${p.id}','type',this.value)"
        >
      </div>

      <div>
        <label>Մին.</label>

        <input
          type="number"
          inputmode="numeric"
          value="${Number(p.minPrice)||0}"
          oninput="editProPrice('${p.id}','minPrice',this.value)"
        >
      </div>

      <div>
        <label>Մաքս.</label>

        <input
          type="number"
          inputmode="numeric"
          value="${Number(p.maxPrice)||0}"
          oninput="editProPrice('${p.id}','maxPrice',this.value)"
        >
      </div>

      <button
        class="primary"
        onclick="saveProfessionalEdit('${p.id}')"
      >
        Պահել
      </button>

      <button
        class="danger"
        onclick="deleteProfessional('${p.id}')"
      >
        Ջնջել
      </button>

    </div>
  `).join("");
}

function editProText(id,field,value){
  const p=professionals.find(x=>x.id===id);

  if(!p){
    return;
  }

  p[field]=value;
}

function editProPrice(id,field,value){
  const p=professionals.find(x=>x.id===id);

  if(!p){
    return;
  }

  p[field]=Math.max(0,Number(value)||0);
}

function saveProfessionalEdit(id){
  const p=professionals.find(x=>x.id===id);

  if(!p){
    return;
  }

  if(p.maxPrice<p.minPrice){
    p.maxPrice=p.minPrice;
  }

  /* Թարմացնում ենք նաև արդեն պահված փաթեթներում */

  savedPackages.forEach(pack=>{
    pack.staff.forEach(s=>{

      if(s.professionalId===p.id){

        s.name=p.name;
        s.type=p.type;
        s.minPrice=p.minPrice;
        s.maxPrice=p.maxPrice;

        const maxProfit=
          Math.max(
            0,
            Number(s.maxPrice)-
            Number(s.minPrice)
          );

        if(Number(s.profit)>maxProfit){
          s.profit=maxProfit;
        }
      }
    });
  });

  /* Թարմացնում ենք նաև բացված փաթեթը */

  currentPackage.staff.forEach(s=>{

    if(s.professionalId===p.id){

      s.name=p.name;
      s.type=p.type;
      s.minPrice=p.minPrice;
      s.maxPrice=p.maxPrice;

      const maxProfit=
        Math.max(
          0,
          Number(s.maxPrice)-
          Number(s.minPrice)
        );

      if(Number(s.profit)>maxProfit){
        s.profit=maxProfit;
      }
    }
  });

  savePros();
  savePackages();

  renderProfessionals();
  renderSaved();
  renderCurrent();

  alert("Մասնագետի նոր գինը պահպանվեց։");
}

function deleteProfessional(id){
  if(!confirm("Ջնջե՞լ մասնագետին։")){
    return;
  }

  professionals=
    professionals.filter(p=>p.id!==id);

  savePros();
  renderProfessionals();
}


/* =========================
   ՄԱՍՆԱԳԵՏ ԸՆՏՐԵԼ
========================= */

function openProfessionalPicker(){
  document
    .getElementById("picker")
    .classList.remove("hidden");

  document.getElementById("proSearch").value="";

  renderProfessionalChoices();
}

function closeProfessionalPicker(){
  document
    .getElementById("picker")
    .classList.add("hidden");
}

function renderProfessionalChoices(){
  const query=
    document
      .getElementById("proSearch")
      .value
      .trim()
      .toLowerCase();

  const list=
    professionals.filter(p=>
      (p.name+" "+p.type)
        .toLowerCase()
        .includes(query)
    );

  const box=
    document.getElementById("professionalChoices");

  if(!list.length){
    box.innerHTML=
      "<div style='padding:12px'>Չգտնվեց։ Կարող ես ձեռքով ավելացնել։</div>";

    return;
  }

  box.innerHTML=
    list.map(p=>`
      <div class="pro-choice">

        <div>

          <strong>${esc(p.name)}</strong>

          <div>${esc(p.type)}</div>

          <div class="price-range">
            ${money(p.minPrice)}
            —
            ${money(p.maxPrice)}
          </div>

        </div>

        <button
          class="primary"
          onclick="addProfessionalToPackage('${p.id}')"
        >
          Ավելացնել
        </button>

      </div>
    `).join("");
}

function addProfessionalToPackage(id){
  const p=
    professionals.find(x=>x.id===id);

  if(!p){
    return;
  }

  currentPackage.staff.push({
    id:uid(),
    professionalId:p.id,
    name:p.name,
    type:p.type,
    minPrice:p.minPrice,
    maxPrice:p.maxPrice,
    profit:0
  });

  closeProfessionalPicker();
  renderCurrent();
}


/* =========================
   ՁԵՌՔՈՎ ԱՎԵԼԱՑՆԵԼ
========================= */

function addManualStaff(){
  const name=
    document
      .getElementById("manualName")
      .value
      .trim();

  const type=
    document
      .getElementById("manualType")
      .value
      .trim();

  const minPrice=
    Number(
      document.getElementById("manualMin").value
    )||0;

  let maxPrice=
    Number(
      document.getElementById("manualMax").value
    )||0;

  if(!name){
    alert("Գրիր անունը կամ ծառայությունը։");
    return;
  }

  if(!maxPrice){
    maxPrice=minPrice;
  }

  if(maxPrice<minPrice){
    alert("Մաքսիմալ գինը չի կարող փոքր լինել մինիմալից։");
    return;
  }

  let professionalId=null;

  if(document.getElementById("saveManualToBase").checked){

    professionalId=uid();

    professionals.push({
      id:professionalId,
      name,
      type,
      minPrice,
      maxPrice
    });

    savePros();
  }

  currentPackage.staff.push({
    id:uid(),
    professionalId,
    name,
    type,
    minPrice,
    maxPrice,
    profit:0
  });

  document.getElementById("manualName").value="";
  document.getElementById("manualType").value="";
  document.getElementById("manualMin").value="";
  document.getElementById("manualMax").value="";
  document.getElementById("saveManualToBase").checked=false;

  closeProfessionalPicker();

  renderProfessionals();
  renderCurrent();
}


/* =========================
   ՓԱԹԵԹ
========================= */

function renderCurrent(){
  document.getElementById("packageName").value=
    currentPackage.name||"";

  const box=
    document.getElementById("staffList");

  if(!currentPackage.staff.length){

    box.innerHTML=
      "<div style='padding:14px 0;color:#8b7b83'>Փաթեթում դեռ մասնագետ չկա։</div>";

  }else{

    box.innerHTML=
      currentPackage.staff.map(s=>{

        const maxProfit=
          Math.max(
            0,
            Number(s.maxPrice)-
            Number(s.minPrice)
          );

        return`
          <div
            class="staff"
            data-staff-id="${s.id}"
          >

            <div class="wide">

              <label>Մասնագետ</label>

              <input
                value="${esc(s.name)}"
                oninput="updateStaffText('${s.id}','name',this.value)"
              >

              <div class="price-range">
                ${esc(s.type)}
              </div>

            </div>


            <div>

              <label>Մինիմալ գին</label>

              <input
                id="min_${s.id}"
                type="number"
                inputmode="numeric"
                value="${Number(s.minPrice)||0}"
                oninput="updateStaffMinLive('${s.id}',this.value)"
              >

            </div>


            <div>

              <label>Մաքսիմալ գին</label>

              <input
                id="max_${s.id}"
                type="number"
                inputmode="numeric"
                value="${Number(s.maxPrice)||0}"
                oninput="updateStaffMaxLive('${s.id}',this.value)"
              >

            </div>


            <div>

              <label>Իմ գումարը</label>

              <input
                id="profit_${s.id}"
                type="number"
                inputmode="numeric"
                value="${Number(s.profit)||0}"
                oninput="updateStaffProfitLive('${s.id}',this.value)"
              >

              <div
                class="limit"
                id="limit_${s.id}"
              >
                Առավելագույնը՝ ${money(maxProfit)}
              </div>

            </div>


            <div>

              <label>Հաճախորդի գին</label>

              <input
                id="total_${s.id}"
                disabled
                value="${money(
                  Number(s.minPrice)+
                  Number(s.profit)
                )}"
              >

            </div>


            <div>

              <button
                class="danger"
                onclick="removeStaff('${s.id}')"
              >
                ✕
              </button>

            </div>

          </div>
        `;
      }).join("");
  }

  updateSummary();
}


/* Այստեղ ամեն թվից հետո renderCurrent()
   ՉԻ աշխատում։
   Դրա համար iPhone-ի keyboard-ը չի փակվում */

function updateStaffText(id,field,value){
  const s=
    currentPackage.staff.find(x=>x.id===id);

  if(!s){
    return;
  }

  s[field]=value;
}

function updateStaffMinLive(id,value){
  const s=
    currentPackage.staff.find(x=>x.id===id);

  if(!s){
    return;
  }

  s.minPrice=
    Math.max(0,Number(value)||0);

  if(s.maxPrice<s.minPrice){
    s.maxPrice=s.minPrice;

    const maxInput=
      document.getElementById("max_"+id);

    if(maxInput){
      maxInput.value=s.maxPrice;
    }
  }

  enforceStaffLimit(s);
  refreshStaffCalculatedFields(s);
  updateSummary();
}

function updateStaffMaxLive(id,value){
  const s=
    currentPackage.staff.find(x=>x.id===id);

  if(!s){
    return;
  }

  s.maxPrice=
    Math.max(0,Number(value)||0);

  if(s.maxPrice<s.minPrice){
    s.maxPrice=s.minPrice;

    const maxInput=
      document.getElementById("max_"+id);

    if(maxInput){
      maxInput.value=s.maxPrice;
    }
  }

  enforceStaffLimit(s);
  refreshStaffCalculatedFields(s);
  updateSummary();
}

function updateStaffProfitLive(id,value){
  const s=
    currentPackage.staff.find(x=>x.id===id);

  if(!s){
    return;
  }

  let val=
    Math.max(
      0,
      Number(value)||0
    );

  const maxProfit=
    Math.max(
      0,
      Number(s.maxPrice)-
      Number(s.minPrice)
    );

  if(val>maxProfit){
    val=maxProfit;

    const input=
      document.getElementById("profit_"+id);

    if(input){
      input.value=val;
    }
  }

  s.profit=val;

  refreshStaffCalculatedFields(s);
  updateSummary();
}

function enforceStaffLimit(s){
  const maxProfit=
    Math.max(
      0,
      Number(s.maxPrice)-
      Number(s.minPrice)
    );

  if(Number(s.profit)>maxProfit){

    s.profit=maxProfit;

    const input=
      document.getElementById("profit_"+s.id);

    if(input){
      input.value=s.profit;
    }
  }
}

function refreshStaffCalculatedFields(s){
  const maxProfit=
    Math.max(
      0,
      Number(s.maxPrice)-
      Number(s.minPrice)
    );

  const limit=
    document.getElementById("limit_"+s.id);

  const total=
    document.getElementById("total_"+s.id);

  if(limit){
    limit.textContent=
      "Առավելագույնը՝ "+
      money(maxProfit);
  }

  if(total){
    total.value=
      money(
        Number(s.minPrice)+
        Number(s.profit)
      );
  }
}

function removeStaff(id){
  currentPackage.staff=
    currentPackage.staff.filter(s=>s.id!==id);

  renderCurrent();
}


/* =========================
   ՀԱՇՎԱՐԿ
========================= */

function updateSummary(){
  const cost=
    currentPackage.staff.reduce(
      (sum,s)=>
        sum+
        (Number(s.minPrice)||0),
      0
    );

  const profit=
    currentPackage.staff.reduce(
      (sum,s)=>
        sum+
        (Number(s.profit)||0),
      0
    );

  const total=cost+profit;

  document.getElementById("packageCost").textContent=money(cost);
  document.getElementById("packageProfit").textContent=money(profit);
  document.getElementById("packageTotal").textContent=money(total);

  document.getElementById("allCost").textContent=money(cost);
  document.getElementById("allProfit").textContent=money(profit);
  document.getElementById("allTotal").textContent=money(total);

  renderPaymentList();
}

function renderPaymentList(){
  const box=
    document.getElementById("paymentList");

  if(!currentPackage.staff.length){
    box.innerHTML="Դեռ մասնագետ չկա։";
    return;
  }

  box.innerHTML=
    currentPackage.staff.map(s=>`
      <div class="payment-row">

        <div>
          <strong>${esc(s.name)}</strong>

          ${
            s.type
              ?
              `<div style="font-size:12px;color:#88767f">
                ${esc(s.type)}
              </div>`
              :
              ""
          }
        </div>

        <strong>
          ${money(s.minPrice)}
        </strong>

      </div>
    `).join("");
}


/* =========================
   ՊԱՀՎԱԾ ՓԱԹԵԹՆԵՐ
========================= */

function toggleSaved(){
  document
    .getElementById("savedPanel")
    .classList.toggle("hidden");

  renderSaved();
}

function saveCurrentPackage(){
  currentPackage.name=
    document
      .getElementById("packageName")
      .value
      .trim();

  if(!currentPackage.name){
    alert("Գրիր փաթեթի անունը։");
    return;
  }

  /* Եթե սա արդեն հին պահված փաթեթ է,
     նույնը թարմացնում ենք,
     նոր կրկնօրինակ չենք ստեղծում */

  if(currentPackage.id){

    const index=
      savedPackages.findIndex(
        p=>p.id===currentPackage.id
      );

    if(index>=0){

      savedPackages[index]=
        JSON.parse(
          JSON.stringify(currentPackage)
        );

    }else{

      savedPackages.push(
        JSON.parse(
          JSON.stringify(currentPackage)
        )
      );
    }

  }else{

    currentPackage.id=uid();

    savedPackages.push(
      JSON.parse(
        JSON.stringify(currentPackage)
      )
    );
  }

  savePackages();
  renderSaved();

  alert("Փաթեթի փոփոխությունները պահպանվեցին։");
}

function renderSaved(){
  const box=
    document.getElementById("savedList");

  if(!savedPackages.length){
    box.innerHTML="<div>Դեռ պահված փաթեթ չկա։</div>";
    return;
  }

  box.innerHTML=
    savedPackages.map(p=>{

      const total=
        p.staff.reduce(
          (sum,s)=>
            sum+
            Number(s.minPrice||0)+
            Number(s.profit||0),
          0
        );

      return`
        <div class="saved-item">

          <div>

            <strong>${esc(p.name)}</strong>

            <div style="
              font-size:12px;
              color:#88767f;
              margin-top:4px
            ">
              ${p.staff.length}
              մասնագետ •
              ${money(total)}
            </div>

          </div>


          <div style="
            display:flex;
            gap:7px;
            flex-wrap:wrap
          ">

            <button
              class="primary"
              onclick="openSavedPackage('${p.id}')"
            >
              Բացել / Փոխել
            </button>

            <button
              class="danger"
              onclick="deleteSavedPackage('${p.id}')"
            >
              Ջնջել
            </button>

          </div>

        </div>
      `;
    }).join("");
}

function openSavedPackage(id){
  const p=
    savedPackages.find(x=>x.id===id);

  if(!p){
    return;
  }

  currentPackage=
    JSON.parse(
      JSON.stringify(p)
    );

  currentPackage.staff=
    currentPackage.staff.map(normalizeStaff);

  renderCurrent();

  document
    .getElementById("savedPanel")
    .classList.add("hidden");
}

function deleteSavedPackage(id){
  if(!confirm("Ջնջե՞լ պահված փաթեթը։")){
    return;
  }

  savedPackages=
    savedPackages.filter(p=>p.id!==id);

  if(currentPackage.id===id){

    currentPackage={
      id:null,
      name:"",
      staff:[]
    };

    renderCurrent();
  }

  savePackages();
  renderSaved();
}

function newPackage(){
  if(
    currentPackage.staff.length ||
    document.getElementById("packageName").value
  ){

    if(
      !confirm(
        "Բացել նոր փաթե՞թ։ Չպահված փոփոխությունները կարող են կորել։"
      )
    ){
      return;
    }
  }

  currentPackage={
    id:null,
    name:"",
    staff:[]
  };

  renderCurrent();
}

load();
</script>
