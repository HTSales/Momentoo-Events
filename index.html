<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENTOO EVENTS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7f9;
  color:#30262c;
}
.container{max-width:1050px;margin:auto;padding:18px}
header{
  background:linear-gradient(135deg,#ffb6c9,#ffd8a8);
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
}
h1{margin:0}
.subtitle{margin-top:6px;opacity:.75}
.menu{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}
button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}
.primary{background:#e986a5;color:white}
.secondary{background:white;color:#5a4550}
.danger{background:#fff0f3;color:#b64868}
.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}
.hidden{display:none}
input{
  width:100%;
  border:1px solid #eadde2;
  border-radius:12px;
  padding:11px;
  font-size:15px;
}
label{
  display:block;
  font-size:12px;
  color:#84767d;
  margin-bottom:5px;
}
.pro-form{
  display:grid;
  grid-template-columns:1.5fr 1.2fr 1fr auto;
  gap:8px;
  align-items:end;
}
.pro-row{
  display:grid;
  grid-template-columns:1.5fr 1.2fr 1fr auto;
  gap:8px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.staff{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:8px;
  align-items:end;
  margin-top:10px;
}
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}
.summary-box{
  padding:14px;
  border-radius:14px;
  background:#faf6f8;
}
.summary-box small{display:block;color:#82757b}
.summary-box strong{font-size:20px}
.final{background:#fff6dd}
.grand{
  background:#30262c;
  color:white;
  border-radius:22px;
  padding:20px;
}
.grand .summary-box{background:rgba(255,255,255,.1)}
.grand small{color:#eee}
.payment-list{
  margin-top:18px;
  background:white;
  color:#30262c;
  border-radius:18px;
  padding:16px;
}
.payment-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
.saved-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.picker{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:999;
}
.picker.hidden{display:none}
.picker-box{
  background:white;
  width:min(620px,100%);
  max-height:80vh;
  overflow:auto;
  border-radius:20px;
  padding:18px;
}
.pro-choice{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border-bottom:1px solid #eee;
}
.pro-choice:hover{background:#fff7f9}
@media(max-width:700px){
  .pro-form,.pro-row{grid-template-columns:1fr}
  .staff{
    grid-template-columns:1fr 1fr;
    background:#fffafd;
    padding:12px;
    border-radius:15px;
  }
  .staff .wide{grid-column:1/-1}
  .summary{grid-template-columns:1fr}
  .saved-item{flex-direction:column;align-items:flex-start}
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>MOMENTOO EVENTS ✨</h1>
  <div class="subtitle">Ստեղծում ենք ակնթարթներ...</div>

  <div class="menu">
    <button class="primary" onclick="newPackage()">+ Նոր փաթեթ</button>
    <button class="secondary" onclick="toggleProfessionals()">👥 Մասնագետներ</button>
    <button class="secondary" onclick="toggleSaved()">📁 Պահված փաթեթներ</button>
    <button class="secondary" onclick="saveCurrentPackage()">💾 Պահպանել</button>
  </div>
</header>

<div id="professionalsPanel" class="card hidden">
  <h2>👥 Մասնագետների բազա</h2>

  <div class="pro-form">
    <div>
      <label>Անուն</label>
      <input id="proName" placeholder="Օր․ Արամ">
    </div>

    <div>
      <label>Մասնագիտություն</label>
      <input id="proType" placeholder="Օր․ DJ">
    </div>

    <div>
      <label>Գին</label>
      <input id="proPrice" type="number" min="0" placeholder="70000">
    </div>

    <button class="primary" onclick="addProfessional()">+ Ավելացնել</button>
  </div>

  <div id="professionalsList" style="margin-top:15px"></div>
</div>

<div id="savedPanel" class="card hidden">
  <h2>📁 Պահված փաթեթներ</h2>
  <div id="savedList"></div>
</div>

<div class="card">
  <label>Փաթեթի անուն</label>
  <input id="packageName" placeholder="Օր․ Birthday Premium">

  <div id="staffList"></div>

  <div style="margin-top:14px">
    <button class="primary" onclick="openProfessionalPicker()">+ Ավելացնել մասնագետ</button>
  </div>

  <div class="summary">
    <div class="summary-box">
      <small>Մասնագետներին</small>
      <strong id="packageCost">0 ֏</strong>
    </div>
    <div class="summary-box">
      <small>Իմ շահույթը</small>
      <strong id="packageProfit">0 ֏</strong>
    </div>
    <div class="summary-box">
      <small>Հաճախորդի գինը</small>
      <strong id="packageTotal">0 ֏</strong>
    </div>
  </div>
</div>

<div class="grand">
  <h2>Վերջնական հաշվարկ</h2>

  <div class="summary">
    <div class="summary-box">
      <small>Մասնագետներին ընդհանուր</small>
      <strong id="allCost">0 ֏</strong>
    </div>
    <div class="summary-box">
      <small>Իմ շահույթը</small>
      <strong id="allProfit">0 ֏</strong>
    </div>
    <div class="summary-box">
      <small>Հաճախորդից ստանալու</small>
      <strong id="allTotal">0 ֏</strong>
    </div>
  </div>

  <div class="payment-list">
    <h3>Մասնագետներին հատկացվող գումարներ</h3>
    <div id="paymentList">Դեռ մասնագետ չկա։</div>
  </div>
</div>

</div>

<div id="picker" class="picker hidden">
  <div class="picker-box">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <h2>Ընտրել մասնագետ</h2>
      <button class="danger" onclick="closeProfessionalPicker()">Փակել</button>
    </div>

    <input
      id="proSearch"
      placeholder="Գրիր DJ, երգիչ, լուսանկարիչ կամ անուն..."
      oninput="renderProfessionalChoices()"
    >

    <div id="professionalChoices" style="margin-top:12px"></div>
  </div>
</div>

<script>
const PRO_KEY="momentoo_pros_v2";
const PACK_KEY="momentoo_packs_v5";

let professionals=[];
let savedPackages=[];
let currentPackage={id:null,name:"",staff:[]};

function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function money(v){
  return (Number(v)||0).toLocaleString("hy-AM")+" ֏";
}

function esc(t){
  return String(t||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function load(){
  try{professionals=JSON.parse(localStorage.getItem(PRO_KEY))||[]}catch{professionals=[]}
  try{savedPackages=JSON.parse(localStorage.getItem(PACK_KEY))||[]}catch{savedPackages=[]}
  renderProfessionals();
  renderSaved();
  newPackage();
}

function savePros(){
  localStorage.setItem(PRO_KEY,JSON.stringify(professionals));
}

function savePacks(){
  localStorage.setItem(PACK_KEY,JSON.stringify(savedPackages));
}

function toggleProfessionals(){
  document.getElementById("professionalsPanel").classList.toggle("hidden");
}

function toggleSaved(){
  document.getElementById("savedPanel").classList.toggle("hidden");
}

function addProfessional(){
  const name=document.getElementById("proName").value.trim();
  const type=document.getElementById("proType").value.trim();
  const price=Number(document.getElementById("proPrice").value)||0;

  if(!name || !type){
    alert("Գրիր անունը և մասնագիտությունը");
    return;
  }

  professionals.push({id:id(),name,type,price});
  savePros();

  document.getElementById("proName").value="";
  document.getElementById("proType").value="";
  document.getElementById("proPrice").value="";

  renderProfessionals();
}

function deleteProfessional(proId){
  if(!confirm("Ջնջե՞լ մասնագետին")) return;
  professionals=professionals.filter(p=>p.id!==proId);
  savePros();
  renderProfessionals();
}

function renderProfessionals(){
  const list=document.getElementById("professionalsList");

  if(professionals.length===0){
    list.innerHTML="Դեռ մասնագետ չկա։";
    return;
  }

  list.innerHTML="";

  professionals.forEach(p=>{
    const row=document.createElement("div");
    row.className="pro-row";

    row.innerHTML=`
      <strong>${esc(p.name)}</strong>
      <span>${esc(p.type)}</span>
      <strong>${money(p.price)}</strong>
      <button class="danger" onclick="deleteProfessional('${p.id}')">Ջնջել</button>
    `;

    list.appendChild(row);
  });
}

function openProfessionalPicker(){
  document.getElementById("picker").classList.remove("hidden");
  document.getElementById("proSearch").value="";
  renderProfessionalChoices();
  setTimeout(()=>document.getElementById("proSearch").focus(),100);
}

function closeProfessionalPicker(){
  document.getElementById("picker").classList.add("hidden");
}

function renderProfessionalChoices(){
  const q=document.getElementById("proSearch").value.trim().toLowerCase();
  const list=document.getElementById("professionalChoices");

  const results=professionals.filter(p=>{
    const text=(p.name+" "+p.type).toLowerCase();
    return text.includes(q);
  });

  if(results.length===0){
    list.innerHTML="Համապատասխան մասնագետ չկա։";
    return;
  }

  list.innerHTML="";

  results.forEach(p=>{
    const row=document.createElement("div");
    row.className="pro-choice";

    row.innerHTML=`
      <div>
        <strong>${esc(p.name)}</strong><br>
        <small>${esc(p.type)} — ${money(p.price)}</small>
      </div>
      <button class="primary" onclick="chooseProfessional('${p.id}')">Ընտրել</button>
    `;

    list.appendChild(row);
  });
}

function chooseProfessional(proId){
  const p=professionals.find(x=>x.id===proId);
  if(!p)return;

  currentPackage.staff.push({
    id:id(),
    professionalId:p.id,
    name:p.name,
    type:p.type,
    cost:p.price,
    profit:0
  });

  closeProfessionalPicker();
  renderStaff();
  updateTotals();
}

function newPackage(){
  currentPackage={id:null,name:"",staff:[]};
  document.getElementById("packageName").value="";
  renderStaff();
  updateTotals();
}

function removeStaff(staffId){
  currentPackage.staff=currentPackage.staff.filter(s=>s.id!==staffId);
  renderStaff();
  updateTotals();
}

function updateStaff(staffId,field,value){
  const s=currentPackage.staff.find(x=>x.id===staffId);
  if(!s)return;

  if(field==="profit"){
    s.profit=Number(value)||0;
  }else if(field==="cost"){
    s.cost=Number(value)||0;
  }

  updateTotals();
}

function renderStaff(){
  const list=document.getElementById("staffList");
  list.innerHTML="";

  currentPackage.staff.forEach(s=>{
    const row=document.createElement("div");
    row.className="staff";

    row.innerHTML=`
      <div class="wide">
        <label>Մասնագետ</label>
        <input readonly value="${esc(s.name)} — ${esc(s.type)}">
      </div>

      <div>
        <label>Իր արժեքը</label>
        <input type="number" min="0" value="${s.cost}" oninput="updateStaff('${s.id}','cost',this.value)">
      </div>

      <div>
        <label>Իմ գումարը</label>
        <input type="number" min="0" value="${s.profit||""}" oninput="updateStaff('${s.id}','profit',this.value)">
      </div>

      <div>
        <label>Հաճախորդի գինը</label>
        <input class="final" id="final-${s.id}" readonly>
      </div>

      <button class="danger" onclick="removeStaff('${s.id}')">✕</button>
    `;

    list.appendChild(row);
  });
}

function updateTotals(){
  currentPackage.name=document.getElementById("packageName").value;

  let cost=0;
  let profit=0;

  currentPackage.staff.forEach(s=>{
    const c=Number(s.cost)||0;
    const p=Number(s.profit)||0;

    cost+=c;
    profit+=p;

    const f=document.getElementById("final-"+s.id);
    if(f)f.value=money(c+p);
  });

  document.getElementById("packageCost").textContent=money(cost);
  document.getElementById("packageProfit").textContent=money(profit);
  document.getElementById("packageTotal").textContent=money(cost+profit);

  document.getElementById("allCost").textContent=money(cost);
  document.getElementById("allProfit").textContent=money(profit);
  document.getElementById("allTotal").textContent=money(cost+profit);

  renderPayments();
}

function renderPayments(){
  const list=document.getElementById("paymentList");

  if(currentPackage.staff.length===0){
    list.innerHTML="Դեռ մասնագետ չկա։";
    return;
  }

  list.innerHTML="";

  currentPackage.staff.forEach(s=>{
    const row=document.createElement("div");
    row.className="payment-row";

    row.innerHTML=`
      <span><strong>${esc(s.name)}</strong> — ${esc(s.type)}</span>
      <strong>${money(s.cost)}</strong>
    `;

    list.appendChild(row);
  });
}

function saveCurrentPackage(){
  currentPackage.name=document.getElementById("packageName").value.trim();

  if(!currentPackage.name){
    alert("Գրիր փաթեթի անունը");
    return;
  }

  if(!currentPackage.id){
    currentPackage.id=id();
    savedPackages.push(JSON.parse(JSON.stringify(currentPackage)));
  }else{
    const i=savedPackages.findIndex(p=>p.id===currentPackage.id);
    if(i>=0)savedPackages[i]=JSON.parse(JSON.stringify(currentPackage));
  }

  savePacks();
  renderSaved();
  alert("Փաթեթը պահպանված է ✅");
}

function renderSaved(){
  const list=document.getElementById("savedList");

  if(savedPackages.length===0){
    list.innerHTML="Դեռ պահված փաթեթ չկա։";
    return;
  }

  list.innerHTML="";

  savedPackages.forEach(p=>{
    const row=document.createElement("div");
    row.className="saved-item";

    row.innerHTML=`
      <strong>${esc(p.name)}</strong>
      <div>
        <button class="primary" onclick="openSaved('${p.id}')">Բացել</button>
        <button class="danger" onclick="deleteSaved('${p.id}')">Ջնջել</button>
      </div>
    `;

    list.appendChild(row);
  });
}

function openSaved(packId){
  const p=savedPackages.find(x=>x.id===packId);
  if(!p)return;

  currentPackage=JSON.parse(JSON.stringify(p));
  document.getElementById("packageName").value=currentPackage.name;

  renderStaff();
  updateTotals();
  document.getElementById("savedPanel").classList.add("hidden");
}

function deleteSaved(packId){
  if(!confirm("Ջնջե՞լ փաթեթը"))return;
  savedPackages=savedPackages.filter(p=>p.id!==packId);
  savePacks();
  renderSaved();
}

document.getElementById("packageName").addEventListener("input",updateTotals);

load();
</script>
</body>
</html>
