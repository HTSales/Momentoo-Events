<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOMENTOO EVENTS</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#fff7f9;
color:#4b3942
}
.wrap{max-width:1000px;margin:auto;padding:14px}
header{
background:linear-gradient(135deg,#ffc7d6,#ffe6bd);
padding:20px;
border-radius:22px;
margin-bottom:14px
}
h1,h2,h3{margin-top:0}
.menu{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}

button{
border:0;
border-radius:12px;
padding:11px 13px;
font-weight:700;
font-size:14px;
cursor:pointer
}

.primary{background:#e986a5;color:white}
.light{background:white;color:#5e4652}
.danger{background:#fff0f4;color:#ae4764}
.gold{background:#fff1c8;color:#745816}

.card{
background:white;
padding:16px;
border-radius:20px;
margin-bottom:14px;
box-shadow:0 5px 18px rgba(50,30,40,.06)
}

.hidden{display:none!important}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #efdce4;
border-radius:11px;
font-size:16px;
background:white
}

textarea{min-height:250px}

label{
display:block;
font-size:12px;
color:#8a7680;
margin-bottom:4px
}

.row{display:flex;gap:8px;align-items:end}

.grid{
display:grid;
grid-template-columns:1.2fr 1.5fr 1fr .8fr .8fr;
gap:8px
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
margin-top:12px
}

.category{
background:#fff5f8;
border:1px solid #efdee5;
border-radius:15px;
padding:14px;
text-align:left;
color:#6c4c59
}

.category small{
display:block;
margin-top:5px;
font-weight:500;
color:#927c86
}

.pro{
display:grid;
grid-template-columns:1.2fr 1.4fr 1fr .7fr .7fr auto auto;
gap:7px;
padding:10px 0;
border-bottom:1px solid #f1e6ea
}

.staff{
background:#fffafd;
border-radius:15px;
padding:12px;
margin-top:10px;
display:grid;
grid-template-columns:1.4fr .8fr .8fr .8fr 1fr auto;
gap:8px;
align-items:end
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:14px
}

.sum{
background:#faf2f6;
padding:14px;
border-radius:14px
}

.sum strong{
display:block;
font-size:20px;
margin-top:4px
}

.final{background:#fff1c8}

.saved{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
border-bottom:1px solid #f1e6ea;
padding:12px 0
}

.note{
font-size:13px;
color:#8d7882;
line-height:1.4
}

.overlay{
position:fixed;
inset:0;
background:rgba(45,30,38,.58);
z-index:999;
overflow:auto;
padding:14px
}

.modal{
background:white;
max-width:760px;
margin:20px auto;
border-radius:20px;
padding:16px
}

.choice{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #f1e6ea
}

@media(max-width:720px){
.grid,.pro{grid-template-columns:1fr}
.staff{grid-template-columns:1fr 1fr}
.staff .wide{grid-column:1/-1}
.summary{grid-template-columns:1fr}
.saved{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<div class="wrap">

<header>
<h1>MOMENTOO EVENTS ✨</h1>

<div class="menu">

<button class="light" onclick="openBackup()">📤 Backup</button>
<button class="light" onclick="openImport()">📥 Import</button>
</div>
</header>

<div id="catsPanel" class="card hidden">
<h2>📂 Բաժիններ</h2>

<div class="row">
<input id="newCat" placeholder="Նոր բաժնի անուն">
<button class="primary" onclick="addCategory()">＋</button>
</div>

<div id="catsList"></div>
</div>

<div id="prosPanel" class="card hidden">
<h2>👥 Մասնագետներ</h2>

<div class="grid">

<div>
<label>Անուն</label>
<input id="pName">
</div>

<div>
<label>Նկարագրություն</label>
<input id="pType">
</div>

<div>
<label>Բաժին</label>
<div class="row">
<select id="pCat"></select>
<button class="primary" onclick="quickCat()">＋</button>
</div>
</div>

<div>
<label>Մին.</label>
<input id="pMin" type="number" inputmode="numeric">
</div>

<div>

<input id="pMax" type="number" inputmode="numeric">
</div>

</div>

<button class="primary" style="margin-top:10px" onclick="addPro()">
＋ Ավելացնել մասնագետ
</button>

<div id="prosBrowser" style="margin-top:18px"></div>
</div>

<div id="savedPanel" class="card hidden">
<h2>📁 Պահված փաթեթներ</h2>
<div id="savedList"></div>
</div>

<div class="card">

<label>Փաթեթի անուն</label>
<input id="packName" placeholder="Փաթեթի անուն">

<div id="staffList"></div>

<button class="primary" style="margin-top:12px" onclick="openPicker()">
＋ Ավելացնել մասնագետ
</button>

<div class="summary">

<div class="sum">
<small>Մասնագետներին</small>
<strong id="cost">0 ֏</strong>
</div>

<div class="sum">
<small>Իմ գումարը</small>
<strong id="profit">0 ֏</strong>
</div>

<div class="sum final">
<small>Հաճախորդի գին</small>
<strong id="total">0 ֏</strong>
</div>

</div>
</div>

</div>

<div id="picker" class="overlay hidden">
<div class="modal">

<div class="row" style="justify-content:space-between">
<h2 style="margin:0">Ընտրել մասնագետ</h2>
<button class="danger" onclick="closePicker()">Փակել</button>
</div>

<input
id="search"
style="margin-top:12px"
placeholder="🔎 Որոնել..."
oninput="pickerSearch()"
>

<div id="pickerBody"></div>

</div>
</div>

<div id="backupModal" class="overlay hidden">
<div class="modal">

<h2>📤 Backup</h2>

<textarea id="backupText" readonly></textarea>

<div class="row">
<button class="primary" onclick="copyBackup()">Copy</button>
<button class="danger" onclick="closeBackup()">Փակել</button>
</div>

</div>
</div>

<div id="importModal" class="overlay hidden">
<div class="modal">

<h2>📥 Import Backup</h2>

<textarea id="importText" placeholder="Paste արա Backup JSON-ը"></textarea>

<div class="row">
<button class="primary" onclick="doImport()">Վերականգնել</button>
<button class="danger" onclick="closeImport()">Փակել</button>
</div>

</div>
</div>

function clone(x){
return JSON.parse(JSON.stringify(x));
}

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function money(v){
return (Number(v)||0).toLocaleString("hy-AM")+" ֏";
}

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function getArray(key){
try{
const a=JSON.parse(localStorage.getItem(key)||"[]");
return Array.isArray(a)?a:[];
}catch(e){
return [];
}
}

function renameCat(oldName){

const n=prompt("Նոր անուն",oldName);

if(!n)return;

const newName=n.trim();

if(!newName)return;

pros.forEach(p=>{
if(p.category===oldName)p.category=newName;
});

packs.forEach(p=>{
(p.staff||[]).forEach(s=>{
if(s.category===oldName)s.category=newName;
});
});

cats=cats.map(x=>x===oldName?newName:x);

if(manageCat===oldName)manageCat=newName;
if(pickerCat===oldName)pickerCat=newName;

saveCats();
savePros();
savePacks();

renderAll();

}

function deleteCat(name){

const count=pros.filter(p=>p.category===name).length;

if(count>0){
alert("Այս բաժնում մասնագետ կա։ Նախ տեղափոխիր մասնագետներին ուրիշ բաժին։");
return;
}

if(!confirm("Ջնջե՞լ բաժինը"))return;

cats=cats.filter(x=>x!==name);

saveCats();

renderAll();

}

function editPro(id,field,value){

const p=pros.find(x=>x.id===id);

if(!p)return;

if(field==="minPrice"||field==="maxPrice"){
value=Math.max(0,Number(value)||0);
}

p[field]=value;

}

function savePro(id){

const p=pros.find(x=>x.id===id);

if(!p)return;

if(Number(p.maxPrice)<Number(p.minPrice)){
p.maxPrice=p.minPrice;
}

packs.forEach(pack=>{

(pack.staff||[]).forEach(s=>{

if(s.professionalId===id){

s.name=p.name;
s.type=p.type;
s.category=p.category;

}

});

});

savePros();
savePacks();

manageCat=p.category;

renderAll();

alert("Պահպանվեց ✅");

}

function deletePro(id){

const p=pros.find(x=>x.id===id);

if(!p)return;

if(!confirm("Ջնջե՞լ "+p.name+" մասնագետին"))return;

pros=pros.filter(x=>x.id!==id);

savePros();

renderAll();

}

function getStaff(id){

return current.staff.find(x=>x.id===id);

}

function changeStaffName(id,value){

const s=getStaff(id);

if(s)s.name=value;

}

function staffMin(id,value){

const s=getStaff(id);

if(!s)return;

s.minPrice=Math.max(0,Number(value)||0);

if(s.maxPrice<s.minPrice){

s.maxPrice=s.minPrice;

const el=document.getElementById("max_"+id);

if(el)el.value=s.maxPrice;

}

fixProfit(s);

refreshStaffRow(s);

updateSummary();

}

function staffMax(id,value){

const s=getStaff(id);

if(!s)return;

s.maxPrice=Math.max(0,Number(value)||0);

if(s.maxPrice<s.minPrice){

s.maxPrice=s.minPrice;

const el=document.getElementById("max_"+id);

if(el)el.value=s.maxPrice;

}

fixProfit(s);

refreshStaffRow(s);

updateSummary();

}

function staffProfit(id,value){

const s=getStaff(id);

if(!s)return;

const limit=Math.max(
0,
Number(s.maxPrice)-Number(s.minPrice)
);

let n=Math.max(0,Number(value)||0);

if(n>limit){

n=limit;

const el=document.getElementById("profit_"+id);

if(el)el.value=n;

}

s.profit=n;

refreshStaffRow(s);

updateSummary();

}

function fixProfit(s){

const limit=Math.max(
0,
Number(s.maxPrice)-Number(s.minPrice)
);

if(Number(s.profit)>limit){

s.profit=limit;

const el=document.getElementById("profit_"+s.id);

if(el)el.value=limit;

}

}

function refreshStaffRow(s){

const limit=document.getElementById("limit_"+s.id);

const final=document.getElementById("final_"+s.id);

if(limit){

limit.textContent=
"Մաքս.՝ "+
money(
Math.max(
0,
Number(s.maxPrice)-Number(s.minPrice)
)
);

}

if(final){

final.value=
money(
Number(s.minPrice||0)+Number(s.profit||0)
);

}

}

function removeStaff(id){

current.staff=current.staff.filter(x=>x.id!==id);

renderCurrent();

}

function updateSummary(){

const cost=current.staff.reduce(
(a,s)=>a+(Number(s.minPrice)||0),
0
);

const profit=current.staff.reduce(
(a,s)=>a+(Number(s.profit)||0),
0
);

document.getElementById("cost").textContent=money(cost);

document.getElementById("profit").textContent=money(profit);

document.getElementById("total").textContent=money(cost+profit);

}

onclick="openPack('${p.id}')">
Բացել
</button>

<button
class="danger"
onclick="deletePack('${p.id}')">
🗑
</button>

</div>

</div>

`;

}).join("");

}

/* BACKUP */

function openBackup(){

const data={

date:new Date().toISOString(),

pros,

packs,

cats

};

document.getElementById("backupText").value=
JSON.stringify(data,null,2);

document.getElementById("backupModal").classList.remove("hidden");

}

function closeBackup(){

document.getElementById("backupModal").classList.add("hidden");

}

function copyBackup(){

const text=document.getElementById("backupText");

text.select();

text.setSelectionRange(0,99999999);

document.execCommand("copy");

alert("Backup-ը copy եղավ ✅");

}

/* IMPORT */

function openImport(){

document.getElementById("importModal").classList.remove("hidden");

}

function closeImport(){

document.getElementById("importModal").classList.add("hidden");

}

function doImport(){

const raw=document.getElementById("importText").value.trim();

if(!raw){

alert("Paste արա Backup-ը");

return;

}

let data;

try{

data=JSON.parse(raw);

}catch(e){

alert("Backup-ը սխալ է");

return;

}

if(
!Array.isArray(data.pros) ||
!Array.isArray(data.packs) ||
!Array.isArray(data.cats)
){

alert("Backup-ի ձևաչափը սխալ է");

return;

}

if(!confirm("Վերականգնե՞լ Backup-ը"))return;

pros=clone(data.pros);
packs=clone(data.packs);
cats=clone(data.cats);

savePros();
savePacks();
saveCats();

closeImport();

renderAll();

alert("Վերականգնվեց ✅");

}

load();

</script>

</body>
</html>
