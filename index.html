<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENTOO EVENTS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7f9;
  color:#30262c;
}

.container{
  max-width:1050px;
  margin:auto;
  padding:18px;
}

header{
  background:linear-gradient(135deg,#ffb6c9,#ffd8a8);
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
}

h1{margin:0;font-size:30px}
.subtitle{margin-top:6px;opacity:.75}

.top-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#e986a5;
  color:white;
}

.secondary{
  background:white;
  color:#5a4550;
}

.danger{
  background:#fff0f3;
  color:#b64868;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
  margin-bottom:16px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #eadde2;
  border-radius:12px;
  font-size:15px;
  background:white;
}

label{
  font-size:12px;
  color:#84767d;
  display:block;
  margin-bottom:5px;
}

.hidden{display:none}

.database-form{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:8px;
  align-items:end;
}

.pro-item{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #eee;
}

.pro-item:last-child{
  border-bottom:0;
}

.staff{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:8px;
  margin-top:10px;
  align-items:end;
}

.final-input{
  background:#fff6dd;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}

.summary-box{
  padding:14px;
  border-radius:14px;
  background:#faf6f8;
}

.summary-box small{
  display:block;
  color:#82757b;
}

.summary-box strong{
  font-size:20px;
}

.grand{
  background:#30262c;
  color:white;
  border-radius:22px;
  padding:20px;
}

.grand .summary-box{
  background:rgba(255,255,255,.1);
}

.grand .summary-box small{
  color:#eee;
}

.payment-list{
  margin-top:18px;
  background:white;
  color:#30262c;
  border-radius:18px;
  padding:16px;
}

.payment-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.payment-row:last-child{
  border-bottom:0;
}

.saved-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.saved-actions{
  display:flex;
  gap:7px;
}

.notice{
  margin-top:10px;
  font-size:13px;
  color:#7e7077;
}

@media(max-width:700px){

  .database-form{
    grid-template-columns:1fr;
  }

  .pro-item{
    grid-template-columns:1fr;
  }

  .staff{
    grid-template-columns:1fr 1fr;
    background:#fffafd;
    padding:12px;
    border-radius:15px;
  }

  .staff-name{
    grid-column:1/-1;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .saved-item{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>MOMENTOO EVENTS ✨</h1>
  <div class="subtitle">Ստեղծում ենք ակնթարթներ...</div>

  <div class="top-buttons">
    <button class="primary" onclick="newPackage()">+ Նոր փաթեթ</button>
    <button class="secondary" onclick="toggleSaved()">📁 Պահված փաթեթներ</button>
    <button class="secondary" onclick="toggleProfessionals()">👥 Մասնագետներ</button>
    <button class="secondary" onclick="saveCurrentPackage()">💾 Պահպանել փաթեթը</button>
  </div>

  <div class="notice" id="saveStatus"></div>
</header>

<div id="professionalsPanel" class="card hidden">

  <h2>👥 Մասնագետներ</h2>

  <div class="database-form">

    <div>
      <label>Մասնագետի անուն / ծառայություն</label>
      <input id="newProName" placeholder="Օր․ DJ">
    </div>

    <div>
      <label>Իր արժեքը</label>
      <input id="newProPrice" type="number" min="0" placeholder="70000">
    </div>

    <button class="primary" onclick="addProfessional()">+ Ավելացնել</button>

  </div>

  <div id="professionalsList" style="margin-top:15px"></div>

</div>

<div id="savedPanel" class="card hidden">
  <h2>📁 Պահված փաթեթներ</h2>
  <div id="savedList"></div>
</div>

<div class="card">

  <div>
    <label>Փաթեթի անուն</label>
    <input id="packageName" placeholder="Օր․ Birthday Premium">
  </div>

  <div id="staffList"></div>

  <div style="margin-top:14px">
    <button class="primary" onclick="addEmptyStaff()">+ Ավելացնել մասնագետ</button>
  </div>

  <div class="summary">

    <div class="summary-box">
      <small>Մասնագետներին վճարելու</small>
      <strong id="packageCost">0 ֏</strong>
    </div>

    <div class="summary-box">
      <small>Իմ շահույթը</small>
      <strong id="packageProfit">0 ֏</strong>
    </div>

    <div class="summary-box">
      <small>Հաճախորդի վերջնական գինը</small>
      <strong id="packageTotal">0 ֏</strong>
    </div>

  </div>

</div>

<div class="grand">

  <h2>Վերջնական հաշվարկ</h2>

  <div class="summary">

    <div class="summary-box">
      <small>Մասնագետներին ընդհանուր</small>
      <strong id="allCost">0 ֏</strong>
    </div>

    <div class="summary-box">
      <small>Իմ շահույթը</small>
      <strong id="allProfit">0 ֏</strong>
    </div>

    <div class="summary-box">
      <small>Հաճախորդից ստանալու</small>
      <strong id="allTotal">0 ֏</strong>
    </div>

  </div>

  <div class="payment-list">
    <h3>Մասնագետներին հատկացվող գումարներ</h3>
    <div id="paymentList">Դեռ մասնագետ չկա։</div>
  </div>

</div>

</div>

<script>

const PRO_STORAGE = "momentoo_professionals_v1";
const PACK_STORAGE = "momentoo_packages_v4";

let professionals = [];
let savedPackages = [];

let currentPackage = {
  id:null,
  name:"",
  staff:[]
};

function makeID(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function money(v){
  return (Number(v)||0).toLocaleString("hy-AM") + " ֏";
}

function esc(t){
  return String(t||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function loadAll(){

  try{
    professionals =
      JSON.parse(localStorage.getItem(PRO_STORAGE)) || [];
  }catch{
    professionals = [];
  }

  try{
    savedPackages =
      JSON.parse(localStorage.getItem(PACK_STORAGE)) || [];
  }catch{
    savedPackages = [];
  }

  renderProfessionals();
  renderSaved();
  newPackage();
}

function saveProfessionals(){
  localStorage.setItem(PRO_STORAGE, JSON.stringify(professionals));
}

function savePackages(){
  localStorage.setItem(PACK_STORAGE, JSON.stringify(savedPackages));
}

function toggleProfessionals(){
  document.getElementById("professionalsPanel").classList.toggle("hidden");
}

function toggleSaved(){
  document.getElementById("savedPanel").classList.toggle("hidden");
}

function addProfessional(){

  const name = document.getElementById("newProName").value.trim();
  const price = Number(document.getElementById("newProPrice").value)||0;

  if(!name){
    alert("Գրիր մասնագետի անունը");
    return;
  }

  professionals.push({
    id:makeID(),
    name:name,
    price:price
  });

  saveProfessionals();

  document.getElementById("newProName").value="";
  document.getElementById("newProPrice").value="";

  renderProfessionals();
  renderStaff();
}

function updateProfessional(id,field,value){

  const p = professionals.find(x=>x.id===id);
  if(!p)return;

  if(field==="name"){
    p.name=value;
  }else{
    p.price=Number(value)||0;
  }

  saveProfessionals();
  renderStaff();
}

function deleteProfessional(id){

  if(!confirm("Ջնջե՞լ մասնագետին")) return;

  professionals = professionals.filter(p=>p.id!==id);

  saveProfessionals();
  renderProfessionals();
  renderStaff();
}

function renderProfessionals(){

  const list = document.getElementById("professionalsList");

  if(professionals.length===0){
    list.innerHTML="Դեռ մասնագետներ չկան։";
    return;
  }

  list.innerHTML="";

  professionals.forEach(p=>{

    const div=document.createElement("div");
    div.className="pro-item";

    div.innerHTML=`

      <input
        value="${esc(p.name)}"
        oninput="updateProfessional('${p.id}','name',this.value)"
      >

      <input
        type="number"
        min="0"
        value="${p.price||""}"
        oninput="updateProfessional('${p.id}','price',this.value)"
      >

      <button class="danger" onclick="deleteProfessional('${p.id}')">
        Ջնջել
      </button>

    `;

    list.appendChild(div);
  });
}

function newPackage(){

  currentPackage={
    id:null,
    name:"",
    staff:[]
  };

  document.getElementById("packageName").value="";

  renderStaff();
  updateTotals();

  showStatus("Նոր փաթեթ է բացված");
}

function addEmptyStaff(){

  currentPackage.staff.push({
    id:makeID(),
    professionalId:"",
    name:"",
    cost:0,
    profit:0
  });

  renderStaff();
  updateTotals();
}

function selectProfessional(staffId,proId){

  const staff=currentPackage.staff.find(s=>s.id===staffId);
  if(!staff)return;

  const pro=professionals.find(p=>p.id===proId);

  if(pro){
    staff.professionalId=pro.id;
    staff.name=pro.name;
    staff.cost=pro.price;
  }else{
    staff.professionalId="";
  }

  renderStaff();
  updateTotals();
}

function updateStaff(id,field,value){

  const staff=currentPackage.staff.find(s=>s.id===id);
  if(!staff)return;

  if(field==="name"){
    staff.name=value;
    staff.professionalId="";
  }else{
    staff[field]=Number(value)||0;
  }

  updateTotals();
}

function removeStaff(id){

  currentPackage.staff=
    currentPackage.staff.filter(s=>s.id!==id);

  renderStaff();
  updateTotals();
}

function renderStaff(){

  const list=document.getElementById("staffList");

  list.innerHTML="";

  currentPackage.staff.forEach(staff=>{

    let options=`<option value="">Ընտրել մասնագետ</option>`;

    professionals.forEach(p=>{

      options+=`
        <option
          value="${p.id}"
          ${staff.professionalId===p.id ? "selected" : ""}
        >
          ${esc(p.name)} — ${money(p.price)}
        </option>
      `;
    });

    const row=document.createElement("div");
    row.className="staff";

    row.innerHTML=`

      <div class="staff-name">

        <label>Ընտրել պահված մասնագետ</label>

        <select onchange="selectProfessional('${staff.id}',this.value)">
          ${options}
        </select>

        <label style="margin-top:7px">Անուն / ծառայություն</label>

        <input
          value="${esc(staff.name)}"
          placeholder="Օր․ DJ"
          oninput="updateStaff('${staff.id}','name',this.value)"
        >

      </div>

      <div>
        <label>Մասնագետին տալիս եմ</label>

        <input
          type="number"
          min="0"
          value="${staff.cost||""}"
          oninput="updateStaff('${staff.id}','cost',this.value)"
        >
      </div>

      <div>
        <label>Իմ գումարը</label>

        <input
          type="number"
          min="0"
          value="${staff.profit||""}"
          oninput="updateStaff('${staff.id}','profit',this.value)"
        >
      </div>

      <div>
        <label>Հաճախորդի գինը</label>

        <input
          class="final-input"
          id="final-${staff.id}"
          readonly
        >
      </div>

      <button class="danger" onclick="removeStaff('${staff.id}')">
        ✕
      </button>

    `;

    list.appendChild(row);
  });
}

function updateTotals(){

  currentPackage.name =
    document.getElementById("packageName").value;

  let totalCost=0;
  let totalProfit=0;

  currentPackage.staff.forEach(staff=>{

    const cost=Number(staff.cost)||0;
    const profit=Number(staff.profit)||0;

    totalCost+=cost;
    totalProfit+=profit;

    const finalInput=
      document.getElementById("final-"+staff.id);

    if(finalInput){
      finalInput.value=money(cost+profit);
    }
  });

  document.getElementById("packageCost").textContent=money(totalCost);
  document.getElementById("packageProfit").textContent=money(totalProfit);
  document.getElementById("packageTotal").textContent=money(totalCost+totalProfit);

  document.getElementById("allCost").textContent=money(totalCost);
  document.getElementById("allProfit").textContent=money(totalProfit);
  document.getElementById("allTotal").textContent=money(totalCost+totalProfit);

  renderPaymentList();
}

function renderPaymentList(){

  const list=document.getElementById("paymentList");

  const valid=currentPackage.staff.filter(s=>
    s.name.trim()!=="" || Number(s.cost)>0
  );

  if(valid.length===0){
    list.innerHTML="Դեռ մասնագետ չկա։";
    return;
  }

  list.innerHTML="";

  valid.forEach(staff=>{

    const row=document.createElement("div");
    row.className="payment-row";

    row.innerHTML=`
      <strong>${esc(staff.name || "Անանուն մասնագետ")}</strong>
      <strong>${money(staff.cost)}</strong>
    `;

    list.appendChild(row);
  });
}

function saveCurrentPackage(){

  currentPackage.name=
    document.getElementById("packageName").value.trim();

  if(!currentPackage.name){
    alert("Գրիր փաթեթի անունը");
    return;
  }

  if(!currentPackage.id){

    currentPackage.id=makeID();

    savedPackages.push(
      JSON.parse(JSON.stringify(currentPackage))
    );

  }else{

    const index=
      savedPackages.findIndex(p=>p.id===currentPackage.id);

    if(index>=0){
      savedPackages[index]=
        JSON.parse(JSON.stringify(currentPackage));
    }else{
      savedPackages.push(
        JSON.parse(JSON.stringify(currentPackage))
      );
    }
  }

  savePackages();
  renderSaved();

  showStatus("Փաթեթը պահպանված է ✅");
}

function renderSaved(){

  const list=document.getElementById("savedList");

  if(savedPackages.length===0){
    list.innerHTML="Դեռ պահված փաթեթ չկա։";
    return;
  }

  list.innerHTML="";

  savedPackages.forEach(pack=>{

    const item=document.createElement("div");
    item.className="saved-item";

    item.innerHTML=`

      <strong>${esc(pack.name)}</strong>

      <div class="saved-actions">

        <button
          class="primary"
          onclick="openPackage('${pack.id}')"
        >
          Բացել
        </button>

        <button
          class="danger"
          onclick="deletePackage('${pack.id}')"
        >
          Ջնջել
        </button>

      </div>
    `;

    list.appendChild(item);
  });
}

function openPackage(id){

  const pack=savedPackages.find(p=>p.id===id);

  if(!pack)return;

  currentPackage=
    JSON.parse(JSON.stringify(pack));

  document.getElementById("packageName").value=
    currentPackage.name;

  renderStaff();
  updateTotals();

  document.getElementById("savedPanel").classList.add("hidden");

  showStatus("Բացված է՝ "+currentPackage.name);
}

function deletePackage(id){

  if(!confirm("Ջնջե՞լ փաթեթը"))return;

  savedPackages=
    savedPackages.filter(p=>p.id!==id);

  savePackages();
  renderSaved();
}

function showStatus(text){

  const el=document.getElementById("saveStatus");

  el.textContent=text;

  setTimeout(()=>{
    el.textContent="";
  },2500);
}

document
.getElementById("packageName")
.addEventListener("input",updateTotals);

loadAll();

</script>

</body>
</html>
