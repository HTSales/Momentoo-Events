<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMENTOO EVENTS</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7f9;
  color:#30262c;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

header{
  background:linear-gradient(135deg,#ffb6c9,#ffd8a8);
  border-radius:24px;
  padding:25px;
  margin-bottom:18px;
}

h1{margin:0;font-size:30px}
.subtitle{margin-top:5px;opacity:.75}

.new-package{
  margin-top:20px;
  display:flex;
  gap:8px;
}

input{
  width:100%;
  border:1px solid #eadde2;
  background:white;
  padding:11px;
  border-radius:12px;
  font-size:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.add{background:#e986a5;color:white}
.delete{background:#fff0f3;color:#b64868}

.package{
  background:white;
  padding:18px;
  border-radius:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.package-header{
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.package-name{
  font-size:19px;
  font-weight:800;
}

.staff{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:8px;
  margin-bottom:9px;
  align-items:end;
}

label{
  font-size:11px;
  color:#887a81;
  display:block;
  margin-bottom:4px;
}

.final{background:#fff8df}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.summary-box{
  background:#faf6f8;
  border-radius:14px;
  padding:13px;
}

.summary-box.profit{background:#effaf3}
.summary-box.total{background:#fff5d9}

.summary-box small{
  display:block;
  color:#82757b;
}

.summary-box strong{font-size:19px}

.grand{
  background:#30262c;
  color:white;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
}

.grand .summary-box{
  background:rgba(255,255,255,.1);
}

.grand small{color:#eee}

.payment-list{
  margin-top:18px;
  background:white;
  color:#30262c;
  border-radius:18px;
  padding:16px;
}

.payment-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.payment-item:last-child{
  border-bottom:0;
}

.empty{
  text-align:center;
  padding:30px;
  color:#9b8d93;
}

@media(max-width:700px){
  .new-package{flex-direction:column}
  .staff{
    grid-template-columns:1fr 1fr;
    background:#fffafd;
    padding:12px;
    border-radius:15px;
  }
  .staff .staff-name{grid-column:1/-1}
  .summary{grid-template-columns:1fr}
  .package-header{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>MOMENTOO EVENTS ✨</h1>
  <div class="subtitle">Ստեղծում ենք ակնթարթներ...</div>

  <div class="new-package">
    <input id="packageName" placeholder="Փաթեթի անունը՝ օրինակ՝ Wedding Premium">
    <button class="add" onclick="addPackage()">+ Ավելացնել փաթեթ</button>
  </div>
</header>

<div id="packages"></div>

<div class="grand">

  <h2>Վերջնական հաշվարկ</h2>

  <div class="summary">

    <div class="summary-box">
      <small>Մասնագետներին վճարելու ընդհանուր</small>
      <strong id="allCost">0 ֏</strong>
    </div>

    <div class="summary-box">
      <small>Իմ ընդհանուր շահույթը</small>
      <strong id="allProfit">0 ֏</strong>
    </div>

    <div class="summary-box">
      <small>Հաճախորդից ստանալու ընդհանուր</small>
      <strong id="allTotal">0 ֏</strong>
    </div>

  </div>

  <div class="payment-list">
    <h3>Մասնագետներին վճարումներ</h3>
    <div id="paymentList">
      Դեռ մասնագետ չկա։
    </div>
  </div>

</div>

</div>

<script>

const STORAGE="momentoo_events_packages_v2";

let packages=[];

function makeID(){
  return Date.now().toString(36)
  +Math.random().toString(36).substring(2);
}

function save(){
  localStorage.setItem(
    STORAGE,
    JSON.stringify(packages)
  );
}

function load(){
  try{
    packages=
    JSON.parse(
      localStorage.getItem(STORAGE)
    )||[];
  }catch{
    packages=[];
  }

  render();
}

function money(value){
  return Number(value||0)
  .toLocaleString("hy-AM")
  +" ֏";
}

function addPackage(){

  const input=
  document.getElementById("packageName");

  const name=input.value.trim();

  if(!name){
    input.focus();
    return;
  }

  packages.push({
    id:makeID(),
    name:name,
    staff:[]
  });

  input.value="";

  save();
  render();
}

function deletePackage(id){

  packages=
  packages.filter(
    p=>p.id!==id
  );

  save();
  render();
}

function addStaff(packageID){

  const pack=
  packages.find(
    p=>p.id===packageID
  );

  if(!pack)return;

  pack.staff.push({
    id:makeID(),
    name:"",
    cost:0,
    profit:0
  });

  save();
  render();
}

function deleteStaff(packageID,staffID){

  const pack=
  packages.find(
    p=>p.id===packageID
  );

  if(!pack)return;

  pack.staff=
  pack.staff.filter(
    s=>s.id!==staffID
  );

  save();
  render();
}

function updatePackageName(id,value){

  const pack=
  packages.find(
    p=>p.id===id
  );

  if(pack){
    pack.name=value;
    save();
  }
}

function updateStaff(
  packageID,
  staffID,
  field,
  value
){

  const pack=
  packages.find(
    p=>p.id===packageID
  );

  if(!pack)return;

  const staff=
  pack.staff.find(
    s=>s.id===staffID
  );

  if(!staff)return;

  if(field==="name"){
    staff[field]=value;
  }else{
    staff[field]=Number(value)||0;
  }

  save();
  updateTotals();
}

function packageTotal(pack){

  let cost=0;
  let profit=0;

  pack.staff.forEach(s=>{

    cost+=Number(s.cost)||0;
    profit+=Number(s.profit)||0;

  });

  return{
    cost,
    profit,
    total:cost+profit
  };
}

function render(){

  const container=
  document.getElementById("packages");

  container.innerHTML="";

  if(packages.length===0){

    container.innerHTML=`
      <div class="empty">
        Դեռ փաթեթ չկա։<br>
        Վերևից ավելացրու առաջին փաթեթը ✨
      </div>
    `;

  }

  packages.forEach(pack=>{

    const box=
    document.createElement("div");

    box.className="package";
    box.id="package-"+pack.id;

    box.innerHTML=`

      <div class="package-header">

        <input
          class="package-name"
          value="${escapeHTML(pack.name)}"
          oninput="updatePackageName(
            '${pack.id}',
            this.value
          )"
        >

        <div>

          <button
            class="add"
            onclick="addStaff('${pack.id}')">
            + Մասնագետ
          </button>

          <button
            class="delete"
            onclick="deletePackage('${pack.id}')">
            Հեռացնել փաթեթը
          </button>

        </div>

      </div>

      <div id="staff-${pack.id}"></div>

      <div class="summary">

        <div class="summary-box">
          <small>Մասնագետներին</small>
          <strong id="cost-${pack.id}">
            0 ֏
          </strong>
        </div>

        <div class="summary-box profit">
          <small>Իմ շահույթը</small>
          <strong id="profit-${pack.id}">
            0 ֏
          </strong>
        </div>

        <div class="summary-box total">
          <small>Փաթեթի գինը</small>
          <strong id="total-${pack.id}">
            0 ֏
          </strong>
        </div>

      </div>

    `;

    container.appendChild(box);

    const staffContainer=
    document.getElementById(
      "staff-"+pack.id
    );

    pack.staff.forEach(staff=>{

      const row=
      document.createElement("div");

      row.className="staff";

      row.innerHTML=`

        <div class="staff-name">

          <label>
            Մասնագետ / ծառայություն
          </label>

          <input
            placeholder="Օր․ DJ"
            value="${escapeHTML(staff.name)}"
            oninput="
              updateStaff(
                '${pack.id}',
                '${staff.id}',
                'name',
                this.value
              )
            "
          >

        </div>

        <div>

          <label>
            Մասնագետին տալիս եմ
          </label>

          <input
            type="number"
            min="0"
            value="${staff.cost||""}"
            oninput="
              updateStaff(
                '${pack.id}',
                '${staff.id}',
                'cost',
                this.value
              )
            "
          >

        </div>

        <div>

          <label>
            Իմ գումարը
          </label>

          <input
            type="number"
            min="0"
            value="${staff.profit||""}"
            oninput="
              updateStaff(
                '${pack.id}',
                '${staff.id}',
                'profit',
                this.value
              )
            "
          >

        </div>

        <div>

          <label>
            Հաճախորդի գինը
          </label>

          <input
            class="final"
            readonly
            id="final-${staff.id}"
          >

        </div>

        <button
          class="delete"
          onclick="
            deleteStaff(
              '${pack.id}',
              '${staff.id}'
            )
          ">
          ✕ Հանել
        </button>

      `;

      staffContainer.appendChild(row);

    });

  });

  updateTotals();
}

function updateTotals(){

  let allCost=0;
  let allProfit=0;
  let payments=[];

  packages.forEach(pack=>{

    const totals=
    packageTotal(pack);

    allCost+=totals.cost;
    allProfit+=totals.profit;

    const cost=
    document.getElementById(
      "cost-"+pack.id
    );

    const profit=
    document.getElementById(
      "profit-"+pack.id
    );

    const total=
    document.getElementById(
      "total-"+pack.id
    );

    if(cost)
      cost.textContent=
      money(totals.cost);

    if(profit)
      profit.textContent=
      money(totals.profit);

    if(total)
      total.textContent=
      money(totals.total);

    pack.staff.forEach(staff=>{

      const final=
      document.getElementById(
        "final-"+staff.id
      );

      if(final){

        final.value=
        money(
          (Number(staff.cost)||0)
          +
          (Number(staff.profit)||0)
        );

      }

      if(
        staff.name.trim()!=="" ||
        Number(staff.cost)>0
      ){

        payments.push({
          name:
            staff.name.trim()
            ||
            "Անանուն մասնագետ",
          cost:
            Number(staff.cost)||0
        });

      }

    });

  });

  document.getElementById(
    "allCost"
  ).textContent=
  money(allCost);

  document.getElementById(
    "allProfit"
  ).textContent=
  money(allProfit);

  document.getElementById(
    "allTotal"
  ).textContent=
  money(
    allCost+allProfit
  );

  const paymentList=
  document.getElementById(
    "paymentList"
  );

  if(payments.length===0){

    paymentList.innerHTML=
    "Դեռ մասնագետ չկա։";

  }else{

    paymentList.innerHTML="";

    payments.forEach(item=>{

      const div=
      document.createElement("div");

      div.className="payment-item";

      div.innerHTML=`
        <strong>
          ${escapeHTML(item.name)}
        </strong>

        <strong>
          ${money(item.cost)}
        </strong>
      `;

      paymentList.appendChild(div);

    });

  }
}

function escapeHTML(text){

  return String(text||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}

document
.getElementById("packageName")
.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      addPackage();
    }

  }
);

load();

</script>

</body>
</html>
