<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f9">
<title>MOMENTOO EVENTS</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#fff7f9;--card:#fff;--text:#44343c;--muted:#8b7781;
 --pink:#e986a5;--line:#efdee5;--gold:#fff1c8;--danger:#b24c69;
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.wrap{max-width:1050px;margin:auto;padding:14px}
header{
 background:linear-gradient(135deg,#ffc2d3,#ffe0b9);
 padding:20px;border-radius:22px;margin-bottom:14px;
}
h1,h2,h3{margin-top:0}
.sub{opacity:.75;margin-top:5px}
.menu{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
button{
 border:0;border-radius:12px;padding:11px 13px;
 font-size:14px;font-weight:700;cursor:pointer;
}
.primary{background:var(--pink);color:#fff}
.light{background:#fff;color:#604b55}
.danger{background:#fff0f4;color:var(--danger)}
.gold{background:var(--gold);color:#755b18}
.card{
 background:#fff;border-radius:20px;padding:16px;
 margin-bottom:14px;box-shadow:0 6px 22px rgba(63,37,50,.06);
}
.hidden{display:none!important}
input,select,textarea{
 width:100%;border:1px solid var(--line);border-radius:11px;
 padding:11px;font-size:16px;background:#fff;color:var(--text);
}
textarea{min-height:260px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;align-items:end}
.grid5{
 display:grid;grid-template-columns:1.1fr 1.5fr 1fr .8fr .8fr;
 gap:8px;align-items:end;
}
.categories{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;margin-top:12px;
}
.categoryCard{
 background:#fff7fa;border:1px solid var(--line);
 border-radius:16px;padding:14px;text-align:left;
 font-weight:800;color:#76515f;
}
.categoryCard small{
 display:block;margin-top:5px;color:var(--muted);font-weight:600;
}
.manageTop{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pro{
 display:grid;grid-template-columns:1.2fr 1.5fr 1fr .8fr .8fr auto auto;
 gap:7px;padding:12px 0;border-bottom:1px solid #f2e8ec;align-items:end;
}
.staff{
 display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr 1fr auto;
 gap:8px;padding:12px;background:#fffafd;
 border-radius:15px;margin-top:10px;align-items:end;
}
.summary{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-top:14px;
}
.sum{background:#faf4f7;padding:14px;border-radius:14px}
.sum small{display:block;color:var(--muted)}
.sum strong{font-size:20px}
.sum.final{background:var(--gold)}
.saved{
 display:flex;justify-content:space-between;gap:10px;
 align-items:center;border-bottom:1px solid #f1e7eb;padding:12px 0;
}
.overlay{
 position:fixed;inset:0;background:rgba(48,33,41,.58);
 z-index:999;padding:14px;overflow:auto;
}
.modal{
 max-width:760px;margin:18px auto;background:#fff;
 border-radius:20px;padding:17px;
}
.choice{
 display:flex;justify-content:space-between;gap:10px;
 align-items:center;border-bottom:1px solid #f1e7eb;padding:12px 0;
}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.badge{
 display:inline-block;background:#fff0f5;border:1px solid var(--line);
 border-radius:999px;padding:5px 9px;font-size:12px;margin-top:4px;
}
@media(max-width:720px){
 .grid5,.pro{grid-template-columns:1fr}
 .staff{grid-template-columns:1fr 1fr}
 .staff .wide{grid-column:1/-1}
 .categories{grid-template-columns:1fr 1fr}
 .summary{grid-template-columns:1fr}
 .saved{align-items:flex-start;flex-direction:column}
}
</style>
</head>

</header>

<div id="catsPanel" class="card hidden">

<div class="row">

</div>

<div id="categoryManager" style="margin-top:12px"></div>
</div>

<div id="prosPanel" class="card hidden">

<div class="grid5">

<div>
<label>Անուն</label>
<input id="pName">
</div>

<div>
<label>Ծառայություն / նկարագրություն</label>
<input id="pType">
</div>

<div>
<label>Բաժին</label>
<div class="row">
<select id="pCat"></select>
<button class="primary" onclick="quickCategory()">＋</button>
</div>
</div>

<div>
<label>Մին. գին</label>
<input id="pMin" type="number" inputmode="numeric">
</div>

<div>
<label>Մաքս. գին</label>
<input id="pMax" type="number" inputmode="numeric">
</div>

</div>

<button class="primary" style="margin-top:10px" onclick="addPro()">
＋ Ավելացնել մասնագետ
</button>

<div id="proBrowser" style="margin-top:18px"></div>
</div>

<div id="savedPanel" class="card hidden">
<h2>📁 Պահված փաթեթներ</h2>
<div id="savedList"></div>
</div>

<div class="card">

<label>Փաթեթի անուն</label>
<input id="packName" placeholder="Օր․ Երեխայի ծնունդ">

<div id="staffList"></div>

<button class="primary" style="margin-top:12px" onclick="openPicker()">
＋ Ավելացնել մասնագետ
</button>

<div class="summary">

<div class="sum">
<small>Մասնագետներին</small>
<strong id="cost">0 ֏</strong>
</div>

<div class="sum">
<small>Իմ գումարը</small>
<strong id="profit">0 ֏</strong>
</div>

<div class="sum final">
<small>Հաճախորդի գին</small>
<strong id="total">0 ֏</strong>
</div>

</div>
</div>
</div>

<div id="picker" class="overlay hidden">
<div class="modal">

<div class="row" style="justify-content:space-between">
<h2 style="margin:0">Ընտրել մասնագետ</h2>
<button class="danger" onclick="closePicker()">Փակել</button>
</div>

<div style="margin-top:12px">
<input id="search"
placeholder="🔎 Փնտրել մասնագետ..."
oninput="pickerSearch()">
</div>

<div id="pickerBody" style="margin-top:12px"></div>

</div>
</div>

<div id="backupModal" class="overlay hidden">
<div class="modal">

<h2>📤 Backup</h2>

<textarea id="backupText" readonly></textarea>

<div class="row">
<button class="primary" onclick="copyBackup()">📋 Copy</button>
<button class="danger" onclick="closeBackup()">Փակել</button>
</div>

</div>
</div>

<div id="importModal" class="overlay hidden">
<div class="modal">

<div class="row">
<button class="primary" onclick="doImport()">Վերականգնել</button>
<button class="danger" onclick="closeImport()">Փակել</button>
</div>

</div>
</div>

 return String(v??"")

 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

 if(t.includes("հրեշտակ")||t.includes("պար")) return "Պարային շոուներ";
 if(t.includes("արջ")) return "Արջուկներ / կերպարներ";
 if(t.includes("քանոն")) return "Երաժիշտներ";
 if(t.includes("ծաղիկ")) return "Ծաղիկներ";

 return "Այլ";
}

   ...p,
   id:p.id||uid(),

   maxPrice:Number(p.maxPrice??p.minPrice??p.price??0),

 };

}

function normalizeStaff(s){

 return {
   ...s,
   id:s.id||uid(),
   minPrice:Number(s.minPrice??s.cost??0),
   maxPrice:Number(s.maxPrice??s.minPrice??s.cost??0),

 };

function load(){

 pros=readArr(PRO_KEY);
 packs=readArr(PACK_KEY);
 cats=readArr(CAT_KEY);

 const initialized=
 localStorage.getItem(INIT_KEY)==="1";

 if(!initialized){

   if(pros.length<14){
     pros=clone(RECOVERED_PROS);
   }

   if(packs.length<6){
     packs=clone(RECOVERED_PACKS);
   }

   localStorage.setItem(INIT_KEY,"1");
 }

 pros=pros.map(normalizePro);

 packs=packs.map(p=>({
   ...p,
   staff:(p.staff||[]).map(normalizeStaff)
 }));

 if(!cats.length){
   cats=[...DEFAULT_CATS];
 }

 pros.forEach(p=>{
   if(p.category&&!cats.includes(p.category)){
     cats.push(p.category);
   }
 });

 savePros();
 savePacks();
 saveCats();

 renderAll();
}

function editPro(id,f,v){

 const p=
 pros.find(
   x=>x.id===id
 );

 if(!p)return;

 if(
   f==="minPrice" ||
   f==="maxPrice"
 ){

   v=
   Math.max(
     0,
     Number(v)||0
   );

 }

 p[f]=v;

}

function savePro(id){

 const p=
 pros.find(
   x=>x.id===id
 );

 if(!p)return;

 if(p.maxPrice<p.minPrice){
   p.maxPrice=p.minPrice;
 }

 packs.forEach(pack=>{

   (pack.staff||[])
   .forEach(s=>{

     if(s.professionalId===id){

       s.name=p.name;
       s.type=p.type;
       s.category=p.category;

     }

   });

 });

 savePros();
 savePacks();

 manageCat=p.category;

 renderAll();

 alert("Պահպանվեց ✅");

}

 const p=
 pros.find(
   x=>x.id===id
 );

 if(!p)return;

 const used=
 packs.filter(
   pack=>
   (pack.staff||[])
   .some(
     s=>s.professionalId===id
   )
 ).length;

 let msg=
 "Ջնջե՞լ «"+
 p.name+
 "» մասնագետին։";

 if(used){

   msg+=
   "\n\nՆա օգտագործված է "+
   used+
   " փաթեթում։ Փաթեթներից ինքն իրեն չի ջնջվի։";

 }

 if(!confirm(msg))return;

 pros=
 pros.filter(
   x=>x.id!==id
 );

 savePros();

 renderAll();

}

function getStaff(id){

 return current.staff.find(
   x=>x.id===id
 );

}

function staffName(id,v){

 const s=getStaff(id);

 if(s){
   s.name=v;
 }

}

function staffMin(id,v){

 const s=getStaff(id);

 if(!s)return;

 s.minPrice=
 Math.max(
   0,
   Number(v)||0
 );

 if(s.maxPrice<s.minPrice){

   s.maxPrice=s.minPrice;

   const el=
   document.getElementById(
     "max_"+id
   );

   if(el){
     el.value=s.maxPrice;
   }

 }

 capProfit(s);

 refreshRow(s);

 updateSummary();

}

function staffMax(id,v){

 const s=getStaff(id);

 if(!s)return;

 s.maxPrice=
 Math.max(
   0,
   Number(v)||0
 );

 if(s.maxPrice<s.minPrice){

   s.maxPrice=s.minPrice;

   const el=
   document.getElementById(
     "max_"+id
   );

   if(el){
     el.value=s.maxPrice;
   }

 }

 capProfit(s);

 refreshRow(s);

 updateSummary();

}

function staffProfit(id,v){

 const s=getStaff(id);

 if(!s)return;

 const limit=
 Math.max(
   0,
   s.maxPrice-s.minPrice
 );

 let n=
 Math.max(
   0,
   Number(v)||0
 );

 if(n>limit){

   n=limit;

   const el=
   document.getElementById(
     "pr_"+id
   );

   if(el){
     el.value=n;
   }

 }

 s.profit=n;

 refreshRow(s);

 updateSummary();

}

function capProfit(s){

 const limit=
 Math.max(
   0,
   s.maxPrice-s.minPrice
 );

 if(Number(s.profit)>limit){

   s.profit=limit;

   const el=
   document.getElementById(
     "pr_"+s.id
   );

   if(el){
     el.value=limit;
   }

 }

}

function refreshRow(s){

 const l=
 document.getElementById(
   "lim_"+s.id
 );

 const t=
 document.getElementById(
   "tot_"+s.id
 );

 if(l){

   l.textContent=
   "Առավելագույնը՝ "+
   money(
     Math.max(
       0,
       s.maxPrice-s.minPrice
     )
   );

 }

 if(t){

   t.value=
   money(
     Number(s.minPrice||0)+
     Number(s.profit||0)
   );

 }

}

   մասնագետ
   •
   ${money(total)}
   </div>

   </div>

   <div>

   <button
   class="primary"
   onclick="openPack('${p.id}')">
   Բացել
   </button>

   <button
   class="danger"
   onclick="deletePack('${p.id}')">
   🗑
   </button>

   </div>

   </div>

   `;

 }).join("");

}

/* BACKUP */

function openBackup(){

 const data={

   exportedAt:
   new Date().toISOString(),

   origin:
   location.origin,

   href:
   location.href,

   allLocalStorage:{}

 };

 for(
   let i=0;
   i<localStorage.length;
   i++
 ){

   const k=
   localStorage.key(i);

   if(k!==null){

     data.allLocalStorage[k]=
     localStorage.getItem(k);

   }

 }

 document
 .getElementById("backupText")
 .value=
 JSON.stringify(
   data,
   null,
   2
 );

 document
 .getElementById("backupModal")
 .classList.remove("hidden");

}

function closeBackup(){

 document
 .getElementById("backupModal")
 .classList.add("hidden");

}

function copyBackup(){

 const t=
 document.getElementById("backupText");

 t.focus();
 t.select();

 t.setSelectionRange(
   0,
   99999999
 );

 document.execCommand("copy");

 alert("Backup-ը պատճենվեց ✅");

}

/* IMPORT */

function openImport(){

 document
 .getElementById("importModal")
 .classList.remove("hidden");

}

function closeImport(){

 document
 .getElementById("importModal")
 .classList.add("hidden");

}

function doImport(){

 const raw=
 document
 .getElementById("importText")
 .value
 .trim();

 if(!raw){

   alert("Paste արա Backup JSON-ը։");

   return;

 }

 let data;

 try{

   data=JSON.parse(raw);

 }catch(e){

   alert("JSON-ը սխալ է։");

   return;

 }

 if(
   !data.allLocalStorage ||
   typeof data.allLocalStorage!=="object"
 ){

   alert(
     "Backup-ի ձևաչափը չի համապատասխանում։"
   );

   return;

 }

 if(
   !confirm(
     "Վերականգնե՞լ Backup-ի տվյալները։"
   )
 )return;

 Object.entries(
   data.allLocalStorage
 )
 .forEach(([k,v])=>{

   if(v===null){

     localStorage.removeItem(k);

   }else{

     localStorage.setItem(
       k,
       String(v)
     );

   }

 });

 localStorage.setItem(
   INIT_KEY,
   "1"
 );

 closeImport();

 load();

 alert(
   "Backup-ը վերականգնվեց ✅"
 );

}

load();

</script>
