<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7a8c4">
<link rel="manifest" href="./manifest.json">
<title>MOMENTOO EVENTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff5f8;color:#402d35}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
header{background:linear-gradient(135deg,#f49abb,#f7bfd2);padding:18px 14px;text-align:center;color:white;font-weight:800;font-size:22px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 15px #00000012}
h2,h3{margin:6px 0 12px}
input,select{width:100%;padding:11px;border:1px solid #ead6de;border-radius:10px;background:white;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btn{background:#f29abb;color:white;padding:11px 15px;border-radius:11px;font-weight:700}
.btn2{background:#fce1ea;color:#8b5265;padding:10px 14px;border-radius:11px;font-weight:700}
.danger{background:#ffe0e0;color:#a33}
.small{font-size:13px;color:#876b75}
.price{font-weight:800;color:#c85b82}
.hidden{display:none!important}
.list-item{padding:12px;border:1px solid #f0dce3;border-radius:13px;margin:8px 0}
.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gridbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.category{padding:14px;border-radius:14px;background:#fff0f5;margin:8px 0;font-weight:800}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:99}
.modalbox{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:700px;max-height:92vh;overflow:auto;padding:16px}
hr{border:0;border-top:1px solid #f0dce3;margin:12px 0}
.total{font-size:19px;font-weight:900}
@media(max-width:600px){
 main{padding:10px}
 .row3{grid-template-columns:1fr}
 .gridbtn{grid-template-columns:1fr 1fr}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<header>MOMENTOO EVENTS</header>
<main id="app"></main>

<div id="modal" class="modal hidden">
<div class="modalbox" id="modalBox"></div>
</div>

<script>
const PRO_KEY='momentoo_pros_v1';
const PACK_KEY='momentoo_packs_v1';
const CAT_KEY='momentoo_cats_v1';
const BUDGET_KEY='momentoo_budget_v1';
const WORK_KEY='momentoo_work_v1';

const DEFAULT_CATS=[
'DJ-ներ','Ջութակահարներ','Ռիլմեյքերներ','Լուսանկարիչներ',
'Դրոն նկարահանում','Ֆոտոզոնա / Դեկոր','Պարային շոուներ',
'Արջուկներ / կերպարներ','Երաժիշտներ','Ծաղիկներ','Այլ'
];

const DEFAULT_PACKS=[
'Երեխայի ծնունդ',
'Նորածնի դուրսգրում',
'Կնունքի փաթեթ',
'Ատամհատիկ',
'Մայրիկի համար',
'Ամուսնության առաջարկ Ասա այո'
];

let pros=JSON.parse(localStorage.getItem(PRO_KEY)||'[]');
let packs=JSON.parse(localStorage.getItem(PACK_KEY)||'[]');
let cats=JSON.parse(localStorage.getItem(CAT_KEY)||'null')||DEFAULT_CATS;
let budgetPacks=JSON.parse(localStorage.getItem(BUDGET_KEY)||'[]');
let work=JSON.parse(localStorage.getItem(WORK_KEY)||'{}');

let current=work.current||{
 name:'',
 staff:[]
};

let budgetDraft=work.budgetDraft||{
 name:'',
 budget:0,
 staff:[]
};

let budgetEdits=work.budgetEdits||{};
let selectedCategory=null;
let editingPack=null;
let editingBudget=null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function num(x){return Number(x)||0}
function esc(x){
 return String(x??'').replace(/[&<>"']/g,m=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
 }[m]))
}

function saveAll(){
 localStorage.setItem(PRO_KEY,JSON.stringify(pros));
 localStorage.setItem(PACK_KEY,JSON.stringify(packs));
 localStorage.setItem(CAT_KEY,JSON.stringify(cats));
 localStorage.setItem(BUDGET_KEY,JSON.stringify(budgetPacks));
 saveWorkState(false);
 scheduleCloudSave();
}

function saveWorkState(sync=true){
 localStorage.setItem(WORK_KEY,JSON.stringify({
  current,budgetDraft,budgetEdits
 }));
 if(sync)scheduleCloudSave();
}

function toast(t){
 const d=document.createElement('div');
 d.textContent=t;
 d.style='position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#402d35;color:white;padding:12px 18px;border-radius:12px;z-index:9999';
 document.body.appendChild(d);
 setTimeout(()=>d.remove(),2200);
}

function renderAll(){
 const app=document.getElementById('app');
 app.innerHTML=`
 <div class="gridbtn">
  <button class="btn" onclick="openNormal()">➕ Ավելացնել փաթեթ</button>
  <button class="btn" onclick="openBudget()">💰 Բյուջետային փաթեթ</button>
 </div>

 <div class="card">
  <div class="gridbtn">
   <button class="btn2" onclick="showCategories()">📂 Բաժիններ</button>
   <button class="btn2" onclick="showPros()">👥 Մասնագետներ</button>
  </div>
 </div>

 <div class="card">
  <h3>📦 Պահված փաթեթներ</h3>
  ${packs.length?packs.map((p,i)=>`
   <div class="list-item flex">
    <div>
     <b>${esc(p.name)}</b>
     <div class="small">${p.staff?.length||0} մասնագետ</div>
    </div>
    <div>
     <button class="btn2" onclick="editPack(${i})">✏️</button>
     <button class="btn2 danger" onclick="deletePack(${i})">🗑</button>
    </div>
   </div>`).join(''):'<div class="small">Դեռ փաթեթ չկա</div>'}
 </div>

 <div class="card">
  <h3>💰 Բյուջետային փաթեթներ</h3>
  ${budgetPacks.length?budgetPacks.map((p,i)=>`
   <div class="list-item flex">
    <div>
     <b>${esc(p.name)}</b>
     <div class="small">Բյուջե՝ ${num(p.budget).toLocaleString()} ֏</div>
    </div>
    <div>
     <button class="btn2" onclick="editBudget(${i})">✏️</button>
     <button class="btn2 danger" onclick="deleteBudget(${i})">🗑</button>
    </div>
   </div>`).join(''):'<div class="small">Դեռ բյուջետային փաթեթ չկա</div>'}
 </div>

 <div class="card">
  <div class="gridbtn">
   <button class="btn2" onclick="showPayments()">💳 Վճարումներ</button>
   <button class="btn2" onclick="backup()">💾 Backup</button>
  </div>
  <br>
  <button class="btn2" style="width:100%" onclick="document.getElementById('importFile').click()">📥 Import</button>
  <input id="importFile" type="file" accept=".json" class="hidden" onchange="importBackup(event)">
 </div>`;
}

function showCategories(){
 selectedCategory=null;
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="flex">
   <h3>📂 Բաժիններ</h3>
   <button class="btn2" onclick="renderAll()">← Հետ</button>
  </div>
  <button class="btn" style="width:100%" onclick="addCategory()">➕ Ավելացնել բաժին</button>
  <hr>
  ${cats.map((c,i)=>`
   <div class="category flex">
    <span onclick="openCategory(${i})" style="flex:1;cursor:pointer">${esc(c)}</span>
    <button class="btn2" onclick="renameCategory(${i})">✏️</button>
    <button class="btn2 danger" onclick="deleteCategory(${i})">🗑</button>
   </div>`).join('')}
 </div>`;
}

function openCategory(i){
 selectedCategory=cats[i];
 showPros();
}

function showPros(){
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="flex">
   <h3>👥 ${selectedCategory?esc(selectedCategory):'Մասնագետներ'}</h3>
   <button class="btn2" onclick="${selectedCategory?'showCategories()':'renderAll()'}">← Հետ</button>
  </div>
  <button class="btn" style="width:100%" onclick="addPro()">➕ Ավելացնել մասնագետ</button>
  <hr>
  ${pros.filter(p=>!selectedCategory||p.cat===selectedCategory).map((p,i)=>`
   <div class="list-item">
    <div class="flex">
     <b>${esc(p.name)}</b>
     <div>
      <button class="btn2" onclick="editPro(${i})">✏️</button>
      <button class="btn2 danger" onclick="deletePro(${i})">🗑</button>
     </div>
    </div>
    <div class="small">${esc(p.cat)}</div>
    <div class="small">Շուկայական՝ ${num(p.max).toLocaleString()} ֏</div>
    <div class="small">Նվազագույն՝ ${num(p.min).toLocaleString()} ֏</div>
    <div class="price">Իմ գումարը՝ ${(num(p.max)-num(p.min)).toLocaleString()} ֏</div>
   </div>`).join('')||'<div class="small">Մասնագետ չկա</div>'}
 </div>`;
}

function addPro(i=null){
 const p=i===null?{name:'',cat:cats[0],max:0,min:0}:pros[i];
 openModal(`
 <h3>${i===null?'Ավելացնել':'Խմբագրել'} մասնագետ</h3>
 <input id="pName" placeholder="Անուն" value="${esc(p.name)}"><br><br>
 <select id="pCat">${cats.map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><br><br>
 <div class="row">
  <input id="pMax" type="number" placeholder="Շուկայական գին" value="${num(p.max)}">
  <input id="pMin" type="number" placeholder="Նվազագույն գին" value="${num(p.min)}">
 </div><br>
 <button class="btn" style="width:100%" onclick="savePro(${i===null?-1:i})">Պահպանել</button>`);
}

function editPro(i){addPro(i)}

function savePro(i){
 const p={
  id:i>=0?pros[i].id:Date.now(),
  name:document.getElementById('pName').value.trim(),
  cat:document.getElementById('pCat').value,
  max:num(document.getElementById('pMax').value),
  min:num(document.getElementById('pMin').value)
 };
 if(!p.name)return toast('Գրիր անունը');
 if(i>=0)pros[i]=p;else pros.push(p);
 closeModal();saveAll();renderAll();showPros();
}

function deletePro(i){
 if(confirm('Ջնջե՞լ մասնագետին')){pros.splice(i,1);saveAll();showPros()}
}

function addCategory(){
 const n=prompt('Բաժնի անունը');
 if(!n?.trim())return;
 cats.push(n.trim());saveAll();showCategories();
}

function renameCategory(i){
 const n=prompt('Նոր անուն',cats[i]);
 if(!n?.trim())return;
 const old=cats[i];
 cats[i]=n.trim();
 pros.forEach(p=>{if(p.cat===old)p.cat=cats[i]});
 saveAll();showCategories();
}

function deleteCategory(i){
 const c=cats[i];
 if(pros.some(p=>p.cat===c)){
  alert('Այս բաժնում մասնագետ կա։ Նախ ջնջիր կամ տեղափոխիր մասնագետներին։');
  return;
 }
 if(confirm('Ջնջե՞լ բաժինը')){cats.splice(i,1);saveAll();showCategories()}
}

function openNormal(pack=null){
 current=pack?clone(pack):{name:'',staff:[]};
 editingPack=pack?packs.indexOf(pack):null;
 renderNormal();
}

function renderNormal(){
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="flex">
   <h3>📦 ${editingPack!==null?'Խմբագրել փաթեթ':'Նոր փաթեթ'}</h3>
   <button class="btn2" onclick="renderAll()">← Հետ</button>
  </div>
  <input id="packName" placeholder="Փաթեթի անուն" value="${esc(current.name)}">
  <hr>
  ${current.staff.map((s,i)=>`
   <div class="list-item">
    <div class="flex"><b>${esc(s.name)}</b><button class="btn2 danger" onclick="removeCurrentStaff(${i})">🗑</button></div>
    <div class="row">
     <input type="number" value="${num(s.amount)}" onchange="current.staff[${i}].amount=num(this.value);saveWorkState()">
     <div class="small" style="padding:10px">Մասնագետի վճար</div>
    </div>
   </div>`).join('')||'<div class="small">Մասնագետ դեռ չկա</div>'}
  <button class="btn2" style="width:100%" onclick="addStaffToNormal()">➕ Ավելացնել մասնագետ</button>
  <hr>
  <div class="total">Ընդհանուր՝ ${current.staff.reduce((a,b)=>a+num(b.amount),0).toLocaleString()} ֏</div>
  <br>
  <button class="btn" style="width:100%" onclick="saveNormal()">💾 Պահպանել</button>
 </div>`;
}

function addStaffToNormal(){
 if(!pros.length)return alert('Սկզբում ավելացրու մասնագետ');
 openModal(`
 <h3>Ավելացնել մասնագետ</h3>
 <select id="staffSelect">
 ${pros.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${num(p.min).toLocaleString()} ֏</option>`).join('')}
 </select><br><br>
 <input id="staffAmount" type="number" placeholder="Վճար մասնագետին"><br><br>
 <button class="btn" style="width:100%" onclick="confirmStaff()">Ավելացնել</button>`);
}

function confirmStaff(){
 const i=num(document.getElementById('staffSelect').value);
 const p=pros[i];
 const amount=num(document.getElementById('staffAmount').value)||num(p.min);
 current.staff.push({proId:p.id,name:p.name,amount});
 closeModal();saveWorkState();renderNormal();
}

function removeCurrentStaff(i){
 current.staff.splice(i,1);saveWorkState();renderNormal();
}

function saveNormal(){
 const name=document.getElementById('packName').value.trim();
 if(!name)return alert('Գրիր փաթեթի անունը');
 current.name=name;
 const item=clone(current);
 if(editingPack!==null)packs[editingPack]=item;
 else packs.push(item);
 saveAll();renderAll();
}

function editPack(i){openNormal(packs[i])}

function deletePack(i){
 if(confirm('Ջնջե՞լ փաթեթը')){packs.splice(i,1);saveAll();renderAll()}
}

function openBudget(pack=null){
 budgetDraft=pack?clone(pack):{name:'',budget:0,staff:[]};
 editingBudget=pack?budgetPacks.indexOf(pack):null;
 renderBudget();
}

function renderBudget(){
 const used=budgetDraft.staff.reduce((a,b)=>a+num(b.amount),0);
 const profit=num(budgetDraft.budget)-used;
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="flex">
   <h3>💰 Բյուջետային փաթեթ</h3>
   <button class="btn2" onclick="renderAll()">← Հետ</button>
  </div>
  <input id="budgetName" placeholder="Փաթեթի անուն" value="${esc(budgetDraft.name)}"><br><br>
  <input id="budgetTotal" type="number" placeholder="Հաճախորդի բյուջե" value="${num(budgetDraft.budget)}">
  <hr>
  ${budgetDraft.staff.map((s,i)=>`
   <div class="list-item">
    <div class="flex">
     <b>${esc(s.name)}</b>
     <button class="btn2 danger" onclick="budgetDraft.staff.splice(${i},1);saveWorkState();renderBudget()">🗑</button>
    </div>
    <div class="small">Շուկայական գին՝ ${num(s.market).toLocaleString()} ֏</div>
    <br>
    <input type="number" value="${num(s.amount)}" onchange="changeBudgetAmount(${i},this.value)">
   </div>`).join('')||'<div class="small">Մասնագետ չկա</div>'}
  <button class="btn2" style="width:100%" onclick="addBudgetStaff()">➕ Ավելացնել մասնագետ</button>
  <hr>
  <div>Մասնագետների ընդհանուր՝ <b>${used.toLocaleString()} ֏</b></div>
  <div class="total">Իմ շահույթը՝ ${profit.toLocaleString()} ֏</div>
  <div class="small">Մնացորդ բյուջեից՝ ${(num(budgetDraft.budget)-used-profit).toLocaleString()} ֏</div>
  <br>
  <button class="btn" style="width:100%" onclick="saveBudget()">💾 Պահպանել</button>
 </div>`;
}

function changeBudgetAmount(i,v){
 const value=num(v);
 const old=budgetDraft.staff[i].amount;
 const total=budgetDraft.staff.reduce((a,b)=>a+num(b.amount),0)-old+value;
 if(total>num(budgetDraft.budget)){
  alert('Մասնագետներին տրված գումարը չի կարող գերազանցել հաճախորդի բյուջեն');
  renderBudget();return;
 }
 budgetDraft.staff[i].amount=value;
 saveWorkState();renderBudget();
}

function addBudgetStaff(){
 if(!pros.length)return alert('Սկզբում ավելացրու մասնագետ');
 openModal(`
 <h3>Ավելացնել մասնագետ</h3>
 <select id="bStaff">
 ${pros.map((p,i)=>`<option value="${i}">${esc(p.name)} — շուկայական ${num(p.max).toLocaleString()} ֏</option>`).join('')}
 </select><br><br>
 <input id="bAmount" type="number" placeholder="Վճար մասնագետին"><br><br>
 <button class="btn" style="width:100%" onclick="confirmBudgetStaff()">Ավելացնել</button>`);
}

function confirmBudgetStaff(){
 const i=num(document.getElementById('bStaff').value);
 const p=pros[i];
 const amount=num(document.getElementById('bAmount').value)||num(p.min);
 const total=budgetDraft.staff.reduce((a,b)=>a+num(b.amount),0)+amount;
 if(total>num(budgetDraft.budget)){
  alert('Այս գումարը գերազանցում է հաճախորդի բյուջեն');
  return;
 }
 budgetDraft.staff.push({
  proId:p.id,name:p.name,market:num(p.max),amount
 });
 closeModal();saveWorkState();renderBudget();
}

function saveBudget(){
 const name=document.getElementById('budgetName').value.trim();
 const budget=num(document.getElementById('budgetTotal').value);
 const total=budgetDraft.staff.reduce((a,b)=>a+num(b.amount),0);
 if(!name)return alert('Գրիր փաթեթի անունը');
 if(total>budget)return alert('Մասնագետների գումարը գերազանցում է բյուջեն');
 budgetDraft.name=name;
 budgetDraft.budget=budget;
 if(editingBudget!==null)budgetPacks[editingBudget]=clone(budgetDraft);
 else budgetPacks.push(clone(budgetDraft));
 saveAll();renderAll();
}

function editBudget(i){openBudget(budgetPacks[i])}

function deleteBudget(i){
 if(confirm('Ջնջե՞լ բյուջետային փաթեթը')){
  budgetPacks.splice(i,1);saveAll();renderAll();
 }
}

function showPayments(){
 const all=[...packs,...budgetPacks];
 const map={};
 all.forEach(p=>(p.staff||[]).forEach(s=>{
  map[s.name]=(map[s.name]||0)+num(s.amount);
 }));
 document.getElementById('app').innerHTML=`
 <div class="card">
  <div class="flex"><h3>💳 Վճարումներ</h3><button class="btn2" onclick="renderAll()">← Հետ</button></div>
  ${Object.keys(map).map(k=>`
   <div class="list-item flex"><b>${esc(k)}</b><span class="price">${map[k].toLocaleString()} ֏</span></div>
  `).join('')||'<div class="small">Տվյալ չկա</div>'}
 </div>`;
}

function backup(){
 const data={pros,packs,cats,budgetPacks,current,budgetDraft,budgetEdits};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);

function importBackup(event){
 const file=event.target.files?.[0];
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(Array.isArray(d.pros))pros=d.pros;
   if(Array.isArray(d.packs))packs=d.packs;
   if(Array.isArray(d.cats))cats=d.cats;
   if(Array.isArray(d.budgetPacks))budgetPacks=d.budgetPacks;
   if(d.current)current=d.current;
   if(d.budgetDraft)budgetDraft=d.budgetDraft;
   if(d.budgetEdits)budgetEdits=d.budgetEdits;
   saveAll();renderAll();toast('Backup-ը ներմուծվեց');
  }catch(e){alert('Backup-ի ֆայլը սխալ է')}
 };
 r.readAsText(file);
}

async function saveCloud(){
 if(!cloudReady||cloudApplying||!window.momentooDB)return;
 try{
  const d=cloudSnapshot();
  const root=momentooDB.collection('momentoo');
  const batch=momentooDB.batch();
  const ts=firebase.firestore.FieldValue.serverTimestamp();

  batch.set(root.doc('pros'),{data:d.pros,updatedAt:ts});
  batch.set(root.doc('packs'),{data:d.packs,updatedAt:ts});
  batch.set(root.doc('cats'),{data:d.cats,updatedAt:ts});
  batch.set(root.doc('budgetPacks'),{data:d.budgetPacks,updatedAt:ts});
  batch.set(root.doc('work'),{
   current:d.current,
   budgetDraft:d.budgetDraft,
   budgetEdits:d.budgetEdits,
   updatedAt:ts
  });
  batch.set(root.doc('meta'),{
   ready:true,
   version:10,
   updatedAt:ts
  },{merge:true});

  await batch.commit();
 }catch(e){
  console.error('Firebase save error',e);
 }
}

function richer(a,b){
 const aa=Array.isArray(a)?a:[];
 const bb=Array.isArray(b)?b:[];
 return bb.length>aa.length?clone(b):clone(a);
}

function mergeByName(local,cloud,prefix){
 const out=clone(Array.isArray(local)?local:[]);
 const idx={};
 out.forEach((x,i)=>idx[String(x.name||x.id||'').toLowerCase()]=i);

 (Array.isArray(cloud)?cloud:[]).forEach(x=>{
  const k=String(x.name||x.id||'').toLowerCase();
  if(k && idx[k]!==undefined){
   const old=out[idx[k]];
   if(JSON.stringify(old).length<JSON.stringify(x).length)out[idx[k]]=clone(x);
  }else{
   out.push(clone(x));
  }
 });
 return out;
}

function mergeCats(local,cloud){
 const out=clone(Array.isArray(local)?local:[]);
 (Array.isArray(cloud)?cloud:[]).forEach(c=>{
  if(!out.includes(c))out.push(c);
 });
 return out;
}

async function loadCloud(){
 try{
  cloudApplying=true;
  const root=momentooDB.collection('momentoo');
  const [pd,pk,cd,bd,wd]=await Promise.all([
   root.doc('pros').get(),
   root.doc('packs').get(),
   root.doc('cats').get(),
   root.doc('budgetPacks').get(),
   root.doc('work').get()
  ]);

  const cp=pd.exists&&Array.isArray(pd.data().data)?pd.data().data:[];
  const ck=pk.exists&&Array.isArray(pk.data().data)?pk.data().data:[];
  const cc=cd.exists&&Array.isArray(cd.data().data)?cd.data().data:[];
  const cb=bd.exists&&Array.isArray(bd.data().data)?bd.data().data:[];
  const local={
   pros:clone(pros),
   packs:clone(packs),
   cats:clone(cats),
   budgetPacks:clone(budgetPacks),
   current:clone(current),
   budgetDraft:clone(budgetDraft),
   budgetEdits:clone(budgetEdits)
  };

  pros=mergeByName(pros,cp,'pro:');
  packs=mergeByName(packs,ck,'pack:');
  cats=mergeCats(cats,cc);
  budgetPacks=mergeByName(budgetPacks,cb,'budget:');

  if(wd.exists){
   const w=wd.data();
   if(w.current&&((w.current.staff||[]).length>=(current.staff||[]).length))
    current=clone(w.current);
   if(w.budgetDraft&&((w.budgetDraft.staff||[]).length>=(budgetDraft.staff||[]).length))
    budgetDraft=clone(w.budgetDraft);
   if(w.budgetEdits)
    budgetEdits=Object.assign({},budgetEdits||{},w.budgetEdits||{});
  }

  saveAll();
  renderAll();
  cloudApplying=false;
  await saveCloud();
 }catch(e){
  cloudApplying=false;
  console.error('Firebase load error:',e);
 }
}

async function initCloud(){
 if(!window.momentooAuth||!window.momentooDB)return;
 try{
  await momentooAuth.signInAnonymously();
  cloudReady=true;

  const root=momentooDB.collection('momentoo');
  const meta=await root.doc('meta').get();

  if(meta.exists&&meta.data()?.ready===true){
   await loadCloud();
  }else{
   await saveCloud();
  }
 }catch(e){
  cloudReady=false;
  console.error('Firebase auth/sync error:',e);
 }
}

async function forceHomeCloudSync(){
 if(!window.momentooAuth||!window.momentooDB)return;
 try{
  if(!momentooAuth.currentUser)
   await momentooAuth.signInAnonymously();

  cloudReady=true;
  const root=momentooDB.collection('momentoo');
  const meta=await root.doc('meta').get();

  if(meta.exists&&meta.data()?.ready===true){
   await loadCloud();
   return;
  }

  await saveCloud();
 }catch(e){
  console.error('Home Screen sync error:',e);
 }
}
