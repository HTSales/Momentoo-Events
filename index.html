<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOMENTOO DATA RESCUE</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff7f9;
  color:#49363f;
}
.wrap{
  max-width:700px;
  margin:auto;
  padding:20px;
}
.box{
  background:white;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}
h1{margin-top:0}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:700;
  background:#e986a5;
  color:white;
}
textarea{
  width:100%;
  min-height:300px;
  border:1px solid #eadce2;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  box-sizing:border-box;
}
.good{
  background:#f4fff7;
}
.warning{
  background:#fff8e8;
}
.key{
  padding:10px 0;
  border-bottom:1px solid #eee;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="wrap">

<div class="box">
<h1>MOMENTOO EVENTS ✨</h1>
<p>Տվյալների անվտանգ վերականգնում</p>
</div>

<div id="status" class="box warning">
Ստուգում եմ պահպանված տվյալները...
</div>

<div class="box">
<h3>📦 Գտնված տվյալներ</h3>
<div id="keys"></div>
</div>

<div class="box">
<button onclick="makeBackup()">📤 Ստեղծել Backup</button>
<button onclick="showAll()">👀 Ցույց տալ ամբողջ տվյալները</button>
</div>

<div id="resultBox" class="box" style="display:none">
<h3>Backup</h3>

<textarea id="result" readonly></textarea>

<button onclick="copyBackup()">📋 Copy Backup</button>
</div>

</div>

<script>
(function(){

  var status=document.getElementById("status");
  var keysBox=document.getElementById("keys");

  try{

    var count=localStorage.length;

    status.className="box good";

    status.innerHTML=
      "<strong>✅ Էջը աշխատում է</strong><br><br>"+
      "LocalStorage-ում գտնվել է <strong>"+
      count+
      "</strong> բաժին։";

    if(count===0){

      keysBox.innerHTML=
        "Այս Safari storage-ում տվյալ չի գտնվել։";

      return;
    }

    var html="";

    for(var i=0;i<count;i++){

      var key=localStorage.key(i);
      var value=localStorage.getItem(key) || "";

      html+=
        '<div class="key">'+
        '<strong>'+escapeHtml(key)+'</strong>'+
        '<br><small>'+
        value.length+
        ' նիշ</small>'+
        '</div>';
    }

    keysBox.innerHTML=html;

  }catch(err){

    status.className="box warning";

    status.innerHTML=
      "<strong>⚠️ Սխալ</strong><br>"+
      escapeHtml(err.message);
  }


  function escapeHtml(text){

    return String(text)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

})();


function collectBackup(){

  var data={
    exportedAt:new Date().toISOString(),
    origin:location.origin,
    href:location.href,
    allLocalStorage:{}
  };

  for(var i=0;i<localStorage.length;i++){

    var key=localStorage.key(i);

    if(key!==null){

      data.allLocalStorage[key]=
        localStorage.getItem(key);
    }
  }

  return JSON.stringify(data,null,2);
}


function makeBackup(){

  var text=collectBackup();

  document.getElementById("resultBox").style.display="block";

  document.getElementById("result").value=text;

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}


function showAll(){
  makeBackup();
}


function copyBackup(){

  var box=document.getElementById("result");

  box.focus();
  box.select();
  box.setSelectionRange(0,99999999);

  try{

    document.execCommand("copy");

    alert("Backup-ը պատճենվեց ✅");

  }catch(e){

    alert("Տեքստը նշված է։ Copy արա ձեռքով։");
  }
}
</script>

</body>
</html>
